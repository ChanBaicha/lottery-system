<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>天翼AI智能体 · 天选抽奖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#0a0e27;color:#fff;min-height:100vh;overflow-x:hidden}
input,button,select,textarea{font-family:inherit;outline:none;border:none}
:root{--pri:#6c5ce7;--pri-l:#a29bfe;--acc:#fd79a8;--gold:#fdcb6e;--grn:#00b894;--red:#e17055;--blue:#0984e3;--card:#161b3c;--card2:#1e2550;--sub:#a0a8c8;--bd:rgba(255,255,255,.1)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--pri);border-radius:2px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(108,92,231,.15),transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(253,121,168,.1),transparent 50%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding:14px 22px 16px;min-height:100vh;display:flex;flex-direction:column}
.bs-header{text-align:center;padding:8px 0 8px}
.bs-title{font-size:2.6em;font-weight:900;letter-spacing:6px;background:linear-gradient(135deg,#fdcb6e 0%,#fd79a8 30%,#a29bfe 60%,#74b9ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleGlow 3s ease-in-out infinite alternate;line-height:1.2}
@keyframes titleGlow{from{filter:drop-shadow(0 0 6px rgba(253,203,110,.3))}to{filter:drop-shadow(0 0 18px rgba(253,203,110,.6))}}
.bs-header-line{width:50%;max-width:500px;height:2px;margin:6px auto 0;background:linear-gradient(90deg,transparent,var(--pri),var(--gold),var(--pri),transparent)}
.fs-btn{position:fixed;top:14px;right:14px;z-index:9000;width:42px;height:42px;border-radius:12px;background:rgba(22,27,60,.8);border:1px solid var(--bd);color:var(--sub);cursor:pointer;font-size:1.2em;display:flex;align-items:center;justify-content:center;transition:.2s;backdrop-filter:blur(8px)}
.fs-btn:hover{background:var(--pri);color:#fff}
.main-content{display:flex;gap:14px;flex:1;min-height:0;margin-bottom:10px}
.left-panel{width:44%;display:flex;flex-direction:column;gap:10px}
.right-panel{width:56%;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--bd)}
.act-count-box{background:linear-gradient(135deg,rgba(108,92,231,.2),rgba(253,203,110,.1));border:1px solid rgba(253,203,110,.3);border-radius:14px;padding:18px;text-align:center}
.act-count-label{font-size:.85em;color:var(--sub);letter-spacing:2px;margin-bottom:4px}
.act-count-num{font-size:4.2em;font-weight:bold;color:var(--gold);line-height:1;text-shadow:0 0 20px rgba(253,203,110,.3)}
.act-count-sub{font-size:.75em;color:var(--sub);margin-top:4px}
.rule-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rule-select{flex:0 0 160px;padding:9px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--bd);color:#fff;font-size:.88em;cursor:pointer}
.rule-cat-select{flex:0 0 100px;padding:9px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--bd);color:#fff;font-size:.82em;cursor:pointer}
.rule-param{flex:1;min-width:80px;padding:9px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--bd);color:#fff;font-size:.88em}
.rule-param::placeholder{color:var(--sub)}
.btn-exec{padding:9px 18px;border-radius:10px;background:var(--gold);color:#333;font-weight:bold;cursor:pointer;font-size:.9em;white-space:nowrap}
.btn-exec:active{transform:scale(.97)}
.rule-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rule-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--bd);font-size:.82em}
.rule-item .rule-tag{padding:2px 8px;border-radius:8px;background:var(--pri);color:#fff;font-size:.76em;white-space:nowrap}
.rule-item .rule-cat{padding:2px 8px;border-radius:8px;font-size:.72em;white-space:nowrap}
.rule-item .rule-desc{flex:1;color:var(--sub)}
.rule-item .rule-del{width:26px;height:26px;border-radius:8px;background:var(--red);color:#fff;cursor:pointer;font-size:.82em;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-add-rule{padding:8px 14px;border-radius:10px;background:transparent;border:1px dashed var(--bd);color:var(--sub);cursor:pointer;font-size:.85em;transition:.2s;margin-top:6px;width:100%}
.btn-add-rule:hover{border-color:var(--pri);color:var(--pri-l)}
.custom-rule-box{margin-top:10px;padding:10px;border-radius:10px;background:rgba(108,92,231,.08);border:1px solid rgba(108,92,231,.25)}
.custom-rule-label{font-size:.78em;color:var(--pri-l);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.custom-rule-row{display:flex;gap:8px;align-items:center}
.custom-rule-input{flex:1;padding:9px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--bd);color:#fff;font-size:.85em}
.custom-rule-input::placeholder{color:var(--sub);font-size:.78em}
.custom-rule-input:focus{outline:none;border-color:var(--pri)}
.btn-custom-exec{padding:9px 16px;border-radius:10px;background:var(--pri);color:#fff;font-weight:bold;cursor:pointer;font-size:.85em;white-space:nowrap}
.btn-custom-exec:active{transform:scale(.97)}
.custom-hint{font-size:.68em;color:var(--sub);margin-top:6px;line-height:1.5}
.lucky-area{flex:1;display:flex;flex-direction:column;min-height:0}
.lucky-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lucky-title{font-size:1.1em;font-weight:bold;color:var(--gold)}
.lucky-count{font-size:.82em;color:var(--sub);padding:3px 10px;border-radius:16px;background:var(--card2)}
.lucky-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;max-height:calc(100vh - 380px)}
.lucky-item{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--bd);transition:.2s}
.lucky-avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--pri);display:flex;align-items:center;justify-content:center;font-size:.9em;font-weight:bold;color:#fff}
.lucky-avatar img{width:100%;height:100%;object-fit:cover}
.lucky-item:hover{border-color:var(--gold);background:rgba(253,203,110,.08)}
.lucky-rank{width:30px;height:30px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.85em;flex-shrink:0}
.lucky-rank.top1{background:var(--gold);color:#333}
.lucky-rank.top2{background:#c0c0c0;color:#333}
.lucky-rank.top3{background:#cd7f32;color:#333}
.lucky-info{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.lucky-name{font-weight:bold;font-size:.88em;white-space:nowrap}
.lucky-detail{font-size:.88em;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lucky-tag{padding:2px 8px;border-radius:8px;background:rgba(0,184,148,.15);color:var(--grn);font-size:.72em;white-space:nowrap}
.lucky-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--sub);font-size:.9em;text-align:center}
.bottom-bar{display:flex;gap:10px;align-items:center}
.bottom-bar .card{flex:1;display:flex;align-items:center;gap:12px;padding:10px 16px}
.btn-danmaku{padding:8px 16px;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer;font-size:.88em;display:flex;align-items:center;gap:5px}
.btn-game{padding:8px 16px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--red));color:#333;font-weight:bold;cursor:pointer;font-size:.88em;display:flex;align-items:center;gap:5px}
.bottom-label{font-size:.8em;color:var(--sub);flex:1}
.bottom-status{font-size:.76em;color:var(--grn);padding:2px 8px;border-radius:8px;background:rgba(0,184,148,.1)}
.music-bar{position:fixed;top:14px;right:64px;z-index:9000;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:24px;background:rgba(22,27,60,.85);border:1px solid var(--bd);backdrop-filter:blur(8px);font-size:.8em;color:var(--sub);max-width:320px}
.music-play-btn{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.music-play-btn.playing{background:var(--grn)}
.music-info{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.music-info .music-name{color:#fff;font-weight:bold;font-size:.85em}
.music-info .music-status{font-size:.7em;color:var(--sub)}
.music-vol{width:50px;height:4px;-webkit-appearance:none;background:var(--card2);border-radius:2px;cursor:pointer;flex-shrink:0}
.music-vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold);cursor:pointer}
.music-more-btn{width:28px;height:28px;border-radius:8px;background:transparent;border:1px solid var(--bd);color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.music-panel{position:fixed;top:60px;right:14px;z-index:9000;width:300px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;display:none;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.music-panel.show{display:block}
.music-panel-title{font-size:.88em;font-weight:bold;color:#fff;margin-bottom:8px}
.music-preset-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.music-preset-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--card2);cursor:pointer;font-size:.8em}
.music-preset-item:hover{background:rgba(108,92,231,.3)}
.music-preset-item.active{background:rgba(108,92,231,.3);border:1px solid var(--pri)}
.music-divider{height:1px;background:var(--bd);margin:8px 0}
.music-upload-area{border:2px dashed var(--bd);border-radius:12px;padding:12px;text-align:center;cursor:pointer}
.music-upload-area:hover{border-color:var(--pri)}
.music-upload-area .upload-text{font-size:.76em;color:var(--sub)}
.music-current{font-size:.76em;color:var(--sub);margin-top:6px;padding:5px 10px;border-radius:8px;background:var(--card2);display:flex;align-items:center;gap:6px}
.music-current .current-name{color:var(--gold);font-weight:bold;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#danmakuLayer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;pointer-events:none;overflow:hidden}
.dm-item{position:absolute;white-space:nowrap;font-weight:bold;text-shadow:1px 1px 3px rgba(0,0,0,.8);animation:dmScroll linear forwards}
@keyframes dmScroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.dm-avatar{display:inline-block;width:1.6em;height:1.6em;border-radius:50%;overflow:hidden;vertical-align:middle;margin-right:6px;background:rgba(255,255,255,.15)}
.dm-avatar img{width:100%;height:100%;object-fit:cover}
.dm-nick{font-weight:bold;margin-right:4px;opacity:.9}
#gameOverlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:150;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9)}
#gameOverlay.show{display:flex}
.game-header{position:absolute;top:30px;left:50%;transform:translateX(-50%);text-align:center;z-index:10}
.game-title{font-size:2.5em;font-weight:bold;margin-bottom:8px}
.game-desc{color:var(--gold);font-size:1.1em}
.game-close{position:absolute;top:20px;right:20px;padding:10px 24px;border-radius:20px;background:var(--red);color:#fff;cursor:pointer;font-size:1em;z-index:20}
#gameCanvas{position:absolute;top:0;left:0;width:100%;height:100%}
.game-result{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:30;display:none;background:rgba(0,0,0,.85);border-radius:20px;padding:40px 60px;max-width:80%;max-height:80%;overflow-y:auto}
.game-result.show{display:block}
.game-result h2{font-size:3em;margin-bottom:16px}
.game-result .rank{font-size:1.3em;margin:6px 0;padding:6px 20px;border-radius:12px}
.confetti{position:fixed;width:10px;height:10px;top:-10px;z-index:9999;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{top:110vh;transform:rotate(720deg)}}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:8px 22px;border-radius:30px;background:rgba(0,0,0,.85);z-index:9999;font-size:.88em;opacity:0;transition:.3s;pointer-events:none}
.mqtt-status{display:flex;align-items:center;gap:4px;font-size:.72em;padding:3px 10px;border-radius:16px;background:rgba(255,255,255,.05)}
.mqtt-dot{width:6px;height:6px;border-radius:50%;background:#555;transition:.3s}
.mqtt-dot.online{background:var(--grn);box-shadow:0 0 6px var(--grn)}
.mqtt-dot.offline{background:var(--red)}
.mqtt-dot.connecting{background:var(--gold);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.bridge-status{display:flex;align-items:center;gap:4px;font-size:.7em;padding:2px 8px;border-radius:12px;background:rgba(255,255,255,.05)}
.bridge-dot{width:6px;height:6px;border-radius:50%;background:#555;transition:.3s}
.bridge-dot.online{background:var(--grn);box-shadow:0 0 6px var(--grn)}
.bridge-dot.offline{background:var(--red)}
.bridge-dot.executing{background:var(--gold);animation:blink 1s infinite}
.thinking-area{margin-top:10px;border-top:1px solid var(--bd);padding-top:10px}
.thinking-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.thinking-title{font-size:.82em;font-weight:bold;color:var(--pri-l);display:flex;align-items:center;gap:5px}
.thinking-page-info{font-size:.68em;color:var(--sub)}
.thinking-display{background:var(--card2);border-radius:12px;padding:12px 14px;min-height:60px;font-size:.78em;line-height:1.6;color:var(--sub);white-space:pre-wrap;word-break:break-all;position:relative;overflow:hidden}
.thinking-display .step-icon{font-size:1.1em;margin-right:4px}
.thinking-display .step-text{color:#fff}
.thinking-display.type-thinking{border-left:3px solid var(--blue)}
.thinking-display.type-info{border-left:3px solid var(--grn)}
.thinking-display.type-rule_result{border-left:3px solid var(--gold)}
.thinking-display.type-warning{border-left:3px solid var(--red)}
.thinking-display.type-final{border-left:3px solid var(--pri);background:rgba(108,92,231,.15)}
.thinking-display.type-error{border-left:3px solid var(--red);background:rgba(225,112,85,.1)}
.thinking-empty{text-align:center;color:var(--sub);font-size:.8em;padding:20px 0}
.thinking-nav{display:flex;gap:6px;margin-top:6px;justify-content:center}
.thinking-nav-btn{padding:4px 12px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);color:var(--sub);cursor:pointer;font-size:.72em}
.thinking-nav-btn:disabled{opacity:.3;cursor:not-allowed}
.thinking-nav-btn.active{background:var(--pri);color:#fff}
</style>
</head>
<body>
<button class="fs-btn" id="fsBtn" onclick="toggleFullscreen()" title="全屏">⛶</button>
<div id="danmakuLayer"></div>
<div id="app">
  <div class="bs-header">
    <div class="bs-title">天翼AI智能体</div>
    <div class="bs-header-line"></div>
  </div>
  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:8px;font-size:.82em;color:var(--sub)">
      <span style="font-size:1.3em">🤖</span>
      <span style="font-weight:bold;color:#fff">天选规则引擎</span>
    </div>
    <div class="mqtt-status"><div class="mqtt-dot connecting" id="mDot"></div><span id="mText">连接中</span></div>
    <div class="bridge-status" id="bridgeStatusWrap"><div class="bridge-dot offline" id="bridgeDot"></div><span id="bridgeText">TeleAgent离线</span></div>
  </div>
  <div class="main-content">
    <div class="left-panel">
      <div class="act-count-box">
        <div class="act-count-label">活动人数</div>
        <div class="act-count-num" id="actCount">0</div>
      </div>
      <div class="card" style="flex:1;overflow-y:auto">
        <div style="font-weight:bold;margin-bottom:10px;font-size:.95em">📋 天选规则配置</div>
        <div class="rule-row">
          <select class="rule-cat-select" id="ruleCatSelect" onchange="onRuleCatChange()"></select>
          <select class="rule-select" id="ruleSelect" onchange="onRuleSelectChange()"></select>
          <input class="rule-param" id="ruleParam" placeholder="参数值">
          <button class="btn-exec" onclick="executeRule()">规则执行</button>
        </div>
        <div class="rule-list" id="ruleList"></div>
        <button class="btn-add-rule" onclick="addRuleOnly()">＋ 增加规则</button>
        <div class="custom-rule-box">
          <div class="custom-rule-label"><span style="font-size:1.1em">🤖</span> TeleAgent 自定义规则</div>
          <div class="custom-rule-row">
            <input class="custom-rule-input" id="customRuleInput" placeholder="用自然语言描述筛选条件..." onkeydown="if(event.key==='Enter')addCustomRule()">
            <button class="btn-custom-exec" onclick="addCustomRule()">执行</button>
          </div>
          <div class="custom-hint">用自然语言描述筛选条件，TeleAgent 会自动理解并执行，例如：姓王且手机尾号是8、答题超过60分的人、笔画最多的前3人</div>
        </div>
      </div>
    </div>
    <div class="right-panel">
      <div class="card lucky-area">
        <div class="lucky-header">
          <div class="lucky-title">🍀 幸运候选</div>
          <div class="lucky-count" id="luckyCount">0 人</div>
        </div>
        <div class="lucky-list" id="luckyList">
          <div class="lucky-empty">添加并执行天选规则后<br>命中全部规则的人员将显示在此</div>
        </div>
        <div class="thinking-area" id="thinkingArea" style="display:none">
          <div class="thinking-header">
            <div class="thinking-title"><span>🤖</span> TeleAgent 思考过程</div>
            <div class="thinking-page-info" id="thinkingPageInfo"></div>
          </div>
          <div class="thinking-display" id="thinkingDisplay">
            <div class="thinking-empty">等待 TeleAgent 开始执行...</div>
          </div>
          <div class="thinking-nav" id="thinkingNav" style="display:none">
            <button class="thinking-nav-btn" id="thinkPrev" onclick="thinkingPrev()">上一页</button>
            <button class="thinking-nav-btn" id="thinkNext" onclick="thinkingNext()">下一页</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="bottom-bar">
    <div class="card">
      <button class="btn-danmaku" onclick="toggleDanmaku()">💬 弹幕互动</button>
      <span class="bottom-label">点击开启/关闭弹幕滚动</span>
      <span class="bottom-status" id="dmStatus">弹幕已开启</span>
    </div>
    <div class="card">
      <button class="btn-game" onclick="openGameMenu()">🎮 互动游戏</button>
      <span class="bottom-label">摇一摇 / 反应速度 / 趣味抢答</span>
      <span class="bottom-status" id="gameStatus">就绪</span>
    </div>
  </div>
</div>
<div class="music-bar" id="musicBar">
  <div class="music-play-btn" id="musicPlayBtn" onclick="togglePlayMusic()">▶</div>
  <div class="music-info"><div class="music-name" id="musicName">未选择音乐</div><div class="music-status" id="musicStatus">点击右侧选择</div></div>
  <input type="range" class="music-vol" id="musicVol" min="0" max="100" value="40" oninput="setMusicVol(this.value)">
  <button class="music-more-btn" onclick="toggleMusicPanel()">🎵</button>
</div>
<div class="music-panel" id="musicPanel">
  <div class="music-panel-title">🎵 背景音乐</div>
  <div class="music-preset-list" id="musicPresetList"></div>
  <div class="music-divider"></div>
  <div class="music-upload-area" onclick="document.getElementById('musicFileInput').click()">
    <div class="upload-text">📁 点击上传自定义音乐</div>
  </div>
  <input type="file" id="musicFileInput" accept="audio/*" style="display:none" onchange="uploadMusic(this)">
  <div class="music-current" id="musicCurrent" style="display:none">
    <span>🎶</span><span class="current-name" id="musicCurrentName"></span><span style="font-size:.7em;color:var(--grn)" id="musicCurrentTag"></span>
  </div>
</div>
<div id="gameOverlay">
  <div class="game-header"><div class="game-title" id="gameTitle"></div><div class="game-desc" id="gameDesc"></div></div>
  <button class="game-close" onclick="closeGame()">✕ 退出游戏</button>
  <canvas id="gameCanvas"></canvas>
  <div class="game-result" id="gameResult"></div>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ========== State ==========
var S={
  mqtt:null,topic:'',room:'',
  participants:[],quizResults:[],quizMap:{},

function strokeCount(name){
  if(!name)return 0;
  var sum=0;
  for(var i=0;i<name.length;i++){
    var c=name[i];
    if(SC[c]){sum+=SC[c]}
    else{sum+=Math.max(1,Math.min(30,Math.round((c.charCodeAt(0)-0x4e00)/1000)+8))}
  }
  return sum
}

// ========== 辅助函数 ==========
function isPrime(n){if(n<2)return false;for(var i=2;i<=Math.sqrt(n);i++){if(n%i===0)return false}return true}
function getLast4(phone){var ph=(phone||'').replace(/\D/g,'');return ph.length>=4?ph.substr(-4):ph}
function getPhoneLast2(phone){var ph=(phone||'').replace(/\D/g,'');return ph.length>=2?parseInt(ph.substr(-2)):0}
// 数字根：一直相加直到个位数
function digitRoot(n){n=Math.abs(n||0);while(n>=10){var s=0;while(n>0){s+=n%10;n=Math.floor(n/10)}n=s}return n}

// 预计算参与者数据
function preCalcParticipant(p){
  var phone=(p.phone||'').replace(/\D/g,'');
  var last4Str=getLast4(phone);
  var last4Sum=last4Str?last4Str.split('').reduce(function(a,b){return a+parseInt(b)},0):0;
  var sc=strokeCount(p.name||'');
  var pf=pinyinFirst(p.name||'');
  var phLast2=getPhoneLast2(phone);
  // 拆分姓笔画和名笔画
  var nameStr=p.name||'';
  var strokeSurname=nameStr.length>0?(SC[nameStr[0]]||strokeCount(nameStr[0])):0;
  var strokeGivenName=nameStr.length>1?strokeCount(nameStr.substr(1)):0;
  // 手机号全部数字之和
  var phoneSum=0;for(var i=0;i<phone.length;i++){phoneSum+=parseInt(phone[i])||0}
  // 手机号前三位之和
  var phonePrefixSum=0;for(var i=0;i<Math.min(3,phone.length);i++){phonePrefixSum+=parseInt(phone[i])||0}
  // quiz数据
  var qr=S.quizMap[(p.name||'')+'|'+(p.phone||'')];
  var quizScore=qr?qr.correctCount||0:0;
  var quizTotal=qr?qr.totalCount||0:0;
  var timeMs=qr?qr.totalTimeMs||0:0;
  var timeSec=Math.floor(timeMs/1000);
  var timeLast2=timeSec%100;
  return{
    name:p.name||'',phone:phone,signed:p.signed||false,won:p.won||false,prizeId:p.prizeId||null,
    team:p.team||'',avatar:p.avatar||'',
    stroke:sc,strokeSurname:strokeSurname,strokeGivenName:strokeGivenName,pinyinFirst:pf,
    last4Str:last4Str,last4Sum:last4Sum,phoneLast2:phLast2,
    phoneSum:phoneSum,phonePrefixSum:phonePrefixSum,
    quizScore:quizScore,quizTotal:quizTotal,timeMs:timeMs,timeSec:timeSec,timeLast2:timeLast2
  }
}

// ========== Supabase 云端 ==========
function initCloud(){
  try{
    if(typeof supabase==='undefined'){console.warn('supabase-js 未加载');return}
    _sb=supabase.createClient(SB_URL,SB_KEY);
    cloudPull();
    _sb.channel('ad-cfg-'+S.room)
      .on('postgres_changes',{event:'*',schema:'public',table:'room_data',filter:'room=eq.'+S.room},function(payload){
        if(_cloudFlag)return;
        if(payload.new&&payload.new.data)applyCloudConfig(payload.new.data);
      })
      .subscribe();
    _sb.channel('ad-pt-'+S.room)
      .on('postgres_changes',{event:'*',schema:'public',table:'participants',filter:'room=eq.'+S.room},function(){
        if(_cloudFlag)return;
        cloudPull();
      })
      .subscribe();
    _sb.channel('ad-qr-'+S.room)
      .on('postgres_changes',{event:'*',schema:'public',table:'quiz_results',filter:'room=eq.'+S.room},function(){
        if(_cloudFlag)return;
        cloudPull();
      })
      .subscribe();
  }catch(e){console.warn('云端初始化失败',e)}
}
function cloudPull(){
  if(!_sb)return;
  _sb.from('room_data').select('data').eq('room',S.room).maybeSingle().then(function(res){
    if(res.error){console.warn('配置拉取失败',res.error.message);return}
    if(res.data&&res.data.data){_cloudFlag=true;applyCloudConfig(res.data.data);setTimeout(function(){_cloudFlag=false},500)}
  });
  // 分批拉取 participants（最小字段，避免大数据量超时）
  cloudPullPage('participants','pid,name,phone,data->signed,data->won,data->prizeId,data->team,data->avatar',0,[],function(rows){
    if(rows.length){
      _cloudFlag=true;
      S.participants=rows.map(function(r){
        var d={id:r.pid||r.pid,name:r.name,phone:r.phone,signed:r.signed,won:r.won,prizeId:r.prizeId,team:r.team,avatar:r.avatar};
        return d;
      });
      setTimeout(function(){_cloudFlag=false},500);
    }
    updatePool();
  });
  // 分批拉取 quiz_results（最小字段，避免大数据量超时）
  cloudPullPage('quiz_results','name,phone,round,data->correctCount,data->totalCount,data->totalTimeMs',0,[],function(rows){
    if(rows.length){
      _cloudFlag=true;
      S.quizResults=rows.map(function(r){
        return {name:r.name,phone:r.phone,round:r.round,correctCount:r.correctCount,totalCount:r.totalCount,totalTimeMs:r.totalTimeMs};
      });
      buildQuizMap();
      setTimeout(function(){_cloudFlag=false},500);
    }
    updatePool();
  });
}
// 分批拉取指定表（fetch+REST Range头，每批200条）
function cloudPullPage(table,cols,offset,acc,cb){
  var url=SB_URL+'/rest/v1/'+table+'?room=eq.'+S.room+'&select='+encodeURIComponent(cols)+'&offset='+offset+'&limit=200';
  fetch(url,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}})
    .then(function(res){
      if(!res.ok)throw new Error(table+' 拉取失败 '+res.status);
      return res.json();
    })
    .then(function(rows){
      acc=acc.concat(rows);
      if(rows.length===200){cloudPullPage(table,cols,offset+200,acc,cb)}
      else{cb(acc)}
    })
    .catch(function(e){console.warn(table+' 拉取失败',e.message);cb(acc)});
}
function applyCloudConfig(d){
  if(!d||typeof d!=='object')return;
  if(d.danmaku){S.danmakuOn=d.danmaku.enable!==false;S.danmakuMax=d.danmaku.max||50;S.danmakuSpeed=d.danmaku.speed||8;S.danmakuFontSize=d.danmaku.fontSize||24}
  updateDanmakuStatus();
}
function buildQuizMap(){
  S.quizMap={};
  S.quizResults.forEach(function(q){
    var key=(q.name||'')+'|'+(q.phone||'');
    if(!S.quizMap[key]||q.round>S.quizMap[key].round){
      S.quizMap[key]=q;
    }
  });
}
function updatePool(){
  buildQuizMap();
  S.eligiblePool=S.participants.filter(function(p){
    return p.signed&&!p.won;
  }).filter(function(p){
    return S.quizMap[(p.name||'')+'|'+(p.phone||'')];
  }).map(preCalcParticipant);
  document.getElementById('actCount').textContent=S.eligiblePool.length;
  if(S.addedRules.length)executeAllRulesLocal();
}

// ========== MQTT ==========
function connectMQTT(){
  var cid='agentdraw_'+uid();
  try{
    S.mqtt=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:cid,keepalive:30,clean:true,reconnectPeriod:3000,connectTimeout:10000});
    S.mqtt.on('connect',function(){
      updateMqtt('online');
      S.mqtt.subscribe(S.topic+'config');
      S.mqtt.subscribe(S.topic+'lottery_result');
      S.mqtt.subscribe(S.topic+'draw_cmd');
      S.mqtt.subscribe(S.topic+'game_cmd');
      S.mqtt.subscribe(S.topic+'shake_data');
      S.mqtt.subscribe(S.topic+'reaction_click');
      S.mqtt.subscribe(S.topic+'quiz_answer');
      S.mqtt.subscribe(S.topic+'danmaku_show');
      S.mqtt.subscribe(S.topic+'avatar_update');
      S.mqtt.subscribe(S.topic+'teleagent_status');
      S.mqtt.subscribe(S.topic+'teleagent_ack');
      S.mqtt.subscribe(S.topic+'teleagent_step');
      S.mqtt.subscribe(S.topic+'teleagent_result');
      S.mqtt.publish(S.topic+'request_config',JSON.stringify({type:'request',from:'agent-draw',time:Date.now()}));
      S.mqtt.publish(S.topic+'teleagent_ping',JSON.stringify({type:'ping',from:'agent-draw',time:Date.now()}));
    });
    S.mqtt.on('message',function(t,m){try{var d=JSON.parse(m.toString());handleMsg(t,d)}catch(e){}});
    S.mqtt.on('error',function(){updateMqtt('offline')});
    S.mqtt.on('reconnect',function(){updateMqtt('connecting')});
    S.mqtt.on('close',function(){updateMqtt('offline')});
  }catch(e){updateMqtt('offline')}
}
function updateMqtt(s){var d=document.getElementById('mDot'),t=document.getElementById('mText');d.className='mqtt-dot '+s;t.textContent=s==='online'?'在线':s==='offline'?'离线':'连接中'}
function handleMsg(t,d){
  if(t.endsWith('config')){
    // 已有 Supabase 直连拉取 participants 和 quiz_results，不覆盖这两个数据源
    // 只同步配置类字段（奖品/字段/签到设置等）
    if(d.prizes)S.prizes=d.prizes;
    if(d.fields)S.fields=d.fields;
    if(d.signin)S.signin=d.signin;
    if(d.drawCount)S.drawCount=d.drawCount;
    if(d.screen)S.screen=d.screen;
    if(d.gameConfig)S.gameConfig=d.gameConfig;
    if(d.danmaku){S.danmakuOn=d.danmaku.enable!==false;S.danmakuMax=d.danmaku.max||50;S.danmakuSpeed=d.danmaku.speed||8;S.danmakuFontSize=d.danmaku.fontSize||24}
    if(d.music)S.music=d.music;
    if(d.quizConfig)S.quizConfig=d.quizConfig;
    if(d.lotteryRule)S.lotteryRule=d.lotteryRule;
    updateDanmakuStatus();
    // 不覆盖 participants 和 quizResults — 保留 Supabase 直连数据
  }else if(t.endsWith('draw_cmd')){
    if(d.action==='start')startDraw();
  }else if(t.endsWith('danmaku_show')){
    showDanmaku(d.text,d.name,d.avatar,d.color);
  }else if(t.endsWith('shake_data')){
    shakePlayers[d.name]=(shakePlayers[d.name]||0)+(d.count||1);
  }else if(t.endsWith('reaction_click')&&reactionState==='go'){
    reactionPlayers[d.name]=(reactionPlayers[d.name]||0)+1;
  }else if(t.endsWith('quiz_answer')){
    if(!quizState.answers[d.name]){quizState.answers[d.name]=d.answer;quizState.roundTimes[d.name]=Date.now()-quizState.roundStart;}
  }else if(t.endsWith('teleagent_status')){
    handleBridgeStatus(d);
  }else if(t.endsWith('teleagent_ack')){
    handleBridgeAck(d);
  }else if(t.endsWith('teleagent_step')){
    handleBridgeStep(d);
  }else if(t.endsWith('teleagent_result')){
    handleBridgeResult(d);
  }
}

// ========== TeleAgent 桥接 ==========
function handleBridgeStatus(d){
  var wasOnline=S.bridgeOnline;
  S.bridgeOnline=d.online===true||d.online==='true';
  updateBridgeUI();
  if(S.bridgeOnline&&!wasOnline){
    // 刚上线，取消降级定时器
    if(S.bridgeAckTimer){clearTimeout(S.bridgeAckTimer);S.bridgeAckTimer=null}
  }
}
function updateBridgeUI(){
  var dot=document.getElementById('bridgeDot');
  var txt=document.getElementById('bridgeText');
  if(S.bridgeExecuting){
    dot.className='bridge-dot executing';
    txt.textContent='TeleAgent执行中';
  }else if(S.bridgeOnline){
    dot.className='bridge-dot online';
    txt.textContent='TeleAgent在线';
  }else{
    dot.className='bridge-dot offline';
    txt.textContent='TeleAgent离线';
  }
}
function handleBridgeAck(d){
  if(d.reqId!==S.bridgeReqId)return;
  if(S.bridgeAckTimer){clearTimeout(S.bridgeAckTimer);S.bridgeAckTimer=null}
  // 桥接已收到请求，开始等待步骤
  S.bridgeExecuting=true;
  updateBridgeUI();
  showThinkingArea(true);
  S.bridgeSteps=[];
  S.bridgeCurrentStep=-1;
  renderThinkingDisplay();
}
function handleBridgeStep(d){
  if(d.reqId!==S.bridgeReqId)return;
  // 只在有新内容时添加步骤
  var step=d.step;
  if(!step)return;
  // 避免重复添加相同步骤
  var existing=S.bridgeSteps.find(function(s){return s.text===step.text&&s.type===step.type});
  if(existing)return;
  S.bridgeSteps.push(step);
  // 自动翻页到最新步骤
  var prevCount=S.bridgeCurrentStep+1;
  S.bridgeCurrentStep=S.bridgeSteps.length-1;
  // 只有当有新内容时才翻页（已经有新步骤）
  renderThinkingDisplay();
  // 如果该步骤包含当前列表，则更新幸运候选
  if(step.currentList){
    S.luckyList=step.currentList.map(function(d){
      return{name:d.name,phone:d.phone,avatar:d.avatar||''};
    });
    renderLuckyList();
    // 更新标签为规则序号
    updateLuckyTags(d.stepIndex+1);
  }
}
function handleBridgeResult(d){
  if(d.reqId!==S.bridgeReqId)return;
  S.bridgeExecuting=false;
  updateBridgeUI();
  if(d.success&&d.finalList){
    S.luckyList=d.finalList.map(function(p){
      return{name:p.name,phone:p.phone,avatar:p.avatar||''};
    });
    renderLuckyList();
    updateLuckyTags(S.addedRules.length);
    if(d.steps&&d.steps>S.bridgeSteps.length){
      toast('TeleAgent 执行完成，命中 '+d.finalList.length+' 人');
    }else{
      toast('TeleAgent 执行完成，命中 '+d.finalList.length+' 人');
    }
  }else if(!d.success){
    toast('TeleAgent 执行失败：'+(d.error||'未知错误')+'，已降级为本地计算');
    // 降级为本地计算
    executeAllRulesLocal();
  }
  // 停止自动翻页（如果有）
  if(S.bridgeStepTimer){clearInterval(S.bridgeStepTimer);S.bridgeStepTimer=null}
}
function updateLuckyTags(ruleCount){
  // 更新幸运候选的标签文字
  var tags=document.querySelectorAll('.lucky-tag');
  tags.forEach(function(t){t.textContent=ruleCount+'条规则命中'});
}
function showThinkingArea(show){
  document.getElementById('thinkingArea').style.display=show?'block':'none';
}
function renderThinkingDisplay(){
  var display=document.getElementById('thinkingDisplay');
  var pageInfo=document.getElementById('thinkingPageInfo');
  var nav=document.getElementById('thinkingNav');
  if(!S.bridgeSteps.length){
    display.innerHTML='<div class=\"thinking-empty\">等待 TeleAgent 开始执行...</div>';
    pageInfo.textContent='';
    nav.style.display='none';
    return;
  }
  var step=S.bridgeSteps[S.bridgeCurrentStep];
  if(!step){
    display.innerHTML='<div class=\"thinking-empty\">无内容</div>';
    pageInfo.textContent='';
    nav.style.display='none';
    return;
  }
  var icon='';
  var typeClass='type-'+(step.type||'info');
  if(step.type==='thinking')icon='🔄';
  else if(step.type==='info')icon='📋';
  else if(step.type==='rule_result')icon='🎯';
  else if(step.type==='warning')icon='⚠️';
  else if(step.type==='final')icon='✅';
  else if(step.type==='error')icon='❌';
  else icon='•';
  display.className='thinking-display '+typeClass;
  display.innerHTML='<span class=\"step-icon\">'+icon+'</span><span class=\"step-text\">'+escHtml(step.text||'')+'</span>';
  pageInfo.textContent=(S.bridgeCurrentStep+1)+' / '+S.bridgeSteps.length;
  // 超过1步时显示翻页按钮
  if(S.bridgeSteps.length>1){
    nav.style.display='flex';
    document.getElementById('thinkPrev').disabled=(S.bridgeCurrentStep<=0);
    document.getElementById('thinkNext').disabled=(S.bridgeCurrentStep>=S.bridgeSteps.length-1);
  }else{

}

function executeRulesViaBridge(){
  if(!S.addedRules.length){toast('请先添加至少一条规则');return}
  if(!S.bridgeOnline){
    // 桥接离线，直接降级
    toast('TeleAgent 离线，使用本地计算');
    executeAllRulesLocal();
    return;
  }
  // 构造请求：自定义规则直接发送原始自然语言文本，不做本地解析/校验
  S.bridgeReqId=uid();
  var rulesPayload=S.addedRules.map(function(ar){
    if(ar.rule.id===999){
      return{id:999,rawText:ar.param};
    }
    return{id:ar.rule.id,param:ar.param};
  });
  var req={
    type:'execute_rules',
    reqId:S.bridgeReqId,
    roomId:S.room,
    rules:rulesPayload,
    time:Date.now()
  };
  // 发送请求
  S.mqtt.publish(S.topic+'teleagent_req',JSON.stringify(req));
  // 设置5秒ack超时，降级为本地计算
  S.bridgeAckTimer=setTimeout(function(){
    if(!S.bridgeExecuting){
      toast('TeleAgent 未响应，降级为本地计算');
      S.bridgeOnline=false;
      updateBridgeUI();
      executeAllRulesLocal();
    }
  },5000);
  // 显示思考区域
  showThinkingArea(true);
  S.bridgeSteps=[];
  S.bridgeCurrentStep=-1;
  renderThinkingDisplay();
  toast('已发送至 TeleAgent，等待执行...');
}
function executeAllRulesLocal(){
  // 降级方案：TeleAgent离线时本地执行
  // 自定义规则（id=999）仍使用本地NLP解析作为降级
  if(!S.eligiblePool.length){
    S.luckyList=[];
    renderLuckyList();
    return;
  }
  var customParsed={};
  S.addedRules.forEach(function(ar){
    if(ar.rule.id===999&&!customParsed[ar.seq]){
      customParsed[ar.seq]=parseNLLocal(ar.param);
    }
  });
  var matched=S.eligiblePool.slice();
  S.addedRules.forEach(function(ar){
    if(ar.rule.id===999){
      var parsed=customParsed[ar.seq];
      if(parsed&&parsed.conditions.length){
        matched=matched.filter(function(d){return parsed.conditions.every(function(c){return c.test(d)})});
      }
    }else{
      matched=matched.filter(function(d){return ar.rule.test(d,ar.param)});
    }
  });
  S.luckyList=matched;
  renderLuckyList();
  updateLuckyTags(S.addedRules.length);
  // 本地执行也展示简单的思考过程
  showThinkingArea(true);
  S.bridgeSteps=[];
  S.bridgeSteps.push({type:'info',text:'TeleAgent 离线，使用浏览器本地计算\n资格池：'+S.eligiblePool.length+' 人'});
  S.addedRules.forEach(function(ar,i){
    if(ar.rule.id===999){
      var parsed=customParsed[ar.seq];
      var descText=parsed&&parsed.conditions.length?parsed.conditions.map(function(c){return c.desc}).join(' + '):'无具体条件，全员保留';
      S.bridgeSteps.push({type:'rule_result',text:'规则'+(i+1)+'：「🤖 '+ar.param+'」\n→ '+descText+'\n命中：'+matched.length+' 人'});
    }else{
      var matched2=S.eligiblePool.slice();
      for(var j=0;j<=i;j++){
        var ar2=S.addedRules[j];
        if(ar2.rule.id===999){var p2=customParsed[ar2.seq];if(p2&&p2.conditions.length){matched2=matched2.filter(function(d){return p2.conditions.every(function(c){return c.test(d)})})}}
        else{matched2=matched2.filter(function(d){return ar2.rule.test(d,ar2.param)})}
      }
      S.bridgeSteps.push({type:'rule_result',text:'规则'+(i+1)+'：「'+ar.rule.desc(ar.param)+'」\n命中：'+matched2.length+' 人'});
    }
  });
  S.bridgeSteps.push({type:'final',text:'本地计算完成，最终命中 '+S.luckyList.length+' 人'});
  S.bridgeCurrentStep=0;
  // 自动逐步翻页
  var stepIdx=0;
  if(S.bridgeStepTimer)clearInterval(S.bridgeStepTimer);
  S.bridgeStepTimer=setInterval(function(){
    if(stepIdx<S.bridgeSteps.length){
      S.bridgeCurrentStep=stepIdx;
      renderThinkingDisplay();
      stepIdx++;
    }else{
      clearInterval(S.bridgeStepTimer);
      S.bridgeStepTimer=null;
    }
  },800);
}
// 本地简化版自然语言解析（降级时使用，覆盖常见句式）
function parseNLCondition(t){
  var m;
  if(m=t.match(/^姓(?:氏是|氏为|氏)?([\u4e00-\u9fa5])$/))return{desc:'姓氏为"'+m[1]+'"',test:function(d){return(d.name||'')[0]===m[1]}};
  if(m=t.match(/^姓([\u4e00-\u9fa5])(?:或|、)姓([\u4e00-\u9fa5])/))return{desc:'姓氏为"'+m[1]+'"或"'+m[2]+'"',test:function(d){var n=(d.name||'')[0];return n===m[1]||n===m[2]}};
  if(m=t.match(/^姓(?:氏)?(?:是|为)?([\u4e00-\u9fa5]{2,5})之一$/)){var ss=m[1].split('');return{desc:'姓氏为'+ss.join('/')+'之一',test:function(d){return ss.indexOf((d.name||'')[0])>=0}}}
  if(m=t.match(/^名(?:字含|字有|中含|字包含|含|有)([\u4e00-\u9fa5]+)/))return{desc:'名字包含"'+m[1]+'"',test:function(d){return(d.name||'').indexOf(m[1])>=0}};
  if(m=t.match(/^(?:姓名|名字)是([\u4e00-\u9fa5]{2,4})$/))return{desc:'姓名为"'+m[1]+'"',test:function(d){return d.name===m[1]}};
  if(m=t.match(/^(?:姓名)?笔画(?:大于|超过|多于)(\d+)/))return{desc:'姓名笔画>'+m[1],test:function(d){return d.stroke>parseInt(m[1])}};
  if(m=t.match(/^(?:姓名)?笔画(?:小于|少于|不足)(\d+)/))return{desc:'姓名笔画<'+m[1],test:function(d){return d.stroke<parseInt(m[1])}};
  if(m=t.match(/^(?:姓名)?笔画(?:等于|是|为)(\d+)/))return{desc:'姓名笔画='+m[1],test:function(d){return d.stroke===parseInt(m[1])}};
  if(m=t.match(/^姓(?:氏)?笔画(?:大于|超过|多于)(\d+)/))return{desc:'姓氏笔画>'+m[1],test:function(d){return d.strokeSurname>parseInt(m[1])}};
  if(m=t.match(/^姓(?:氏)?笔画(?:小于|少于|不足)(\d+)/))return{desc:'姓氏笔画<'+m[1],test:function(d){return d.strokeSurname<parseInt(m[1])}};
  if(m=t.match(/^名(?:字)?笔画(?:大于|超过|多于)(\d+)/))return{desc:'名字笔画>'+m[1],test:function(d){return d.strokeGivenName>parseInt(m[1])}};
  if(m=t.match(/^名(?:字)?笔画(?:小于|少于|不足)(\d+)/))return{desc:'名字笔画<'+m[1],test:function(d){return d.strokeGivenName<parseInt(m[1])}};
  if(m=t.match(/^(?:姓名)?笔画数字根(?:是|为)(\d+)/))return{desc:'姓名笔画数字根='+m[1],test:function(d){return digitRoot(d.stroke)===parseInt(m[1])}};
  if(m=t.match(/^手机(?:号)?(?:尾号|末位|最后一位|末尾)(?:是|为)?(\d+)/))return{desc:'手机尾号为'+m[1],test:function(d){return(d.phone||'').endsWith(m[1])}};
  if(m=t.match(/^手机(?:号)?(?:含|包含|含有|包括)(\d+)/))return{desc:'手机号包含"'+m[1]+'"',test:function(d){return(d.phone||'').indexOf(m[1])>=0}};
  if(m=t.match(/^手机(?:号)?以(\d{3})开头$/))return{desc:'手机号以'+m[1]+'开头',test:function(d){return(d.phone||'').startsWith(m[1])}};
  if(m=t.match(/^手机(?:号)?前三?位(?:是|为)(\d{3})/))return{desc:'手机号前三位为'+m[1],test:function(d){return(d.phone||'').startsWith(m[1])}};
  if(m=t.match(/^手机后四?位(?:是|为)(\d{4})/))return{desc:'手机后四位为'+m[1],test:function(d){return(d.phone||'').substr(-4)===m[1]}};
  if(m=t.match(/^手机(?:号)?数字之和?(?:大于|超过|多于)(\d+)/))return{desc:'手机号数字之和>'+m[1],test:function(d){return d.phoneSum>parseInt(m[1])}};
  if(m=t.match(/^手机(?:号)?数字之和?(?:小于|少于|不足)(\d+)/))return{desc:'手机号数字之和<'+m[1],test:function(d){return d.phoneSum<parseInt(m[1])}};
  if(m=t.match(/^手机后四?位之和?(?:大于|超过)(\d+)/))return{desc:'手机后四位之和>'+m[1],test:function(d){return d.last4Sum>parseInt(m[1])}};
  if(m=t.match(/^手机后四?位之和?(?:小于|少于)(\d+)/))return{desc:'手机后四位之和<'+m[1],test:function(d){return d.last4Sum<parseInt(m[1])}};
  if(m=t.match(/^手机(?:号)?数字根(?:是|为)(\d+)/))return{desc:'手机号数字根='+m[1],test:function(d){return digitRoot(d.phoneSum)===parseInt(m[1])}};
  if(m=t.match(/^答题(?:得分|分数)?(?:超过|大于|多于)(\d+)/))return{desc:'答题得分>'+m[1]+'分',test:function(d){return d.quizScore>parseInt(m[1])}};
  if(m=t.match(/^答题(?:得分|分数)?(?:少于|小于|不足)(\d+)/))return{desc:'答题得分<'+m[1]+'分',test:function(d){return d.quizScore<parseInt(m[1])}};
  if(m=t.match(/^答题(?:得分|分数)?(?:等于|是|为)(\d+)/))return{desc:'答题得分='+m[1]+'分',test:function(d){return d.quizScore===parseInt(m[1])}};
  if(m=t.match(/^答题(?:用时|时间)?(?:少于|小于|不足)(\d+)秒?/))return{desc:'答题用时<'+m[1]+'秒',test:function(d){return d.timeSec<parseInt(m[1])}};
  if(m=t.match(/^答题(?:用时|时间)?(?:超过|大于|多于)(\d+)秒?/))return{desc:'答题用时>'+m[1]+'秒',test:function(d){return d.timeSec>parseInt(m[1])}};
  if(/^已(?:参加)?答题$/.test(t))return{desc:'已答题',test:function(d){return d.quizScore>0||d.timeSec>0}};
  if(/^未(?:参加)?答题$/.test(t)||/^没(?:有)?答题$/.test(t))return{desc:'未答题',test:function(d){return!d.quizScore&&!d.timeSec}};
  if(m=t.match(/^答(?:题)?(?:正确|对)(?:数|题)?(?:大于|超过|多于)(\d+)/))return{desc:'答对题数>'+m[1],test:function(d){return d.quizScore>parseInt(m[1])}};
  if(m=t.match(/^(?:姓名)?笔画(?:和|与|\+|加)手机(?:号)?数字之和?(?:大于|超过)(\d+)/))return{desc:'笔画+手机数字之和>'+m[1],test:function(d){return(d.stroke+d.phoneSum)>parseInt(m[1])}};
  return null;
}
function parseNLLocal(text){
  var normalized=(text||'').trim().replace(/\s+/g,'');
  var andParts=normalized.split(/且|并且|，|,/).filter(function(s){return s&&s.trim()});
  var conditions=[];
  for(var i=0;i<andParts.length;i++){
    var part=andParts[i].trim();if(!part)continue;
    var orParts=part.split(/或(者)?/).filter(function(s){return s&&s!=='者'&&s.trim()});
    if(orParts.length>1){
      var orConds=[];
      for(var j=0;j<orParts.length;j++){var sub=orParts[j].trim();if(!sub)continue;var c=parseNLCondition(sub);if(c)orConds.push(c)}
      if(orConds.length){var ot=orConds.map(function(c){return c.test});conditions.push({desc:'('+orConds.map(function(c){return c.desc}).join(' 或 ')+')',test:function(d){return ot.some(function(t){return t(d)})}})}
    }else{var c=parseNLCondition(part);if(c)conditions.push(c)}
  }
  return{conditions:conditions,logic:'AND'};
}

    paramInput.style.display='none';

    paramInput.parentNode.insertBefore(sel,paramInput);
  }else{
    paramInput.style.display='';

  }

function getRuleParam(){
  var id=parseInt(document.getElementById('ruleSelect').value);

  if(rule.pType==='select'){
    var sel=document.getElementById('ruleParamSelect');
    return sel?sel.value:'';

  return document.getElementById('ruleParam').value.trim();

function openGame(id){

function startShakeRound(duration){

  var roundInterval=setInterval(function(){
    gameCtx.clearRect(0,0,gameCanvas.width,gameCanvas.height);

    if(timeLeft<=0){clearInterval(roundInterval);endShakeGame(sorted)}
    timeLeft--;
  },1000);
}
function endShakeGame(sorted){

var reactionState='waiting',reactionTime=0,reactionPlayers={};
function runReactionGame(){
  reactionState='waiting';reactionPlayers={};
  var duration=(S.gameConfig&&S.gameConfig.reactionDuration)||15;
  gameCtx.fillStyle='#e17055';gameCtx.fillRect(0,0,gameCanvas.width,gameCanvas.height);
  gameCtx.fillStyle='#fff';gameCtx.font='bold 48px Microsoft YaHei';gameCtx.textAlign='center';gameCtx.textBaseline='middle';
  gameCtx.fillText('请准备...',gameCanvas.width/2,gameCanvas.height/2);

  if(S.mqtt){S.mqtt.subscribe(S.topic+'reaction_click')}
  var cd=3;
  var cdInterval=setInterval(function(){
    if(cd<=0){clearInterval(cdInterval);startReactionRound(duration);return}
    gameCtx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
    gameCtx.fillStyle='#e17055';gameCtx.fillRect(0,0,gameCanvas.width,gameCanvas.height);
    gameCtx.fillStyle='#fff';gameCtx.font='bold 100px Microsoft YaHei';gameCtx.textAlign='center';gameCtx.textBaseline='middle';
    gameCtx.fillText(cd,gameCanvas.width/2,gameCanvas.height/2);

  },1000);
}
function startReactionRound(duration){
  reactionState='go';reactionTime=Date.now();
  document.getElementById('gameDesc').textContent='游戏进行中！手机端点击绿点！';
  if(S.mqtt&&S.mqtt.connected)S.mqtt.publish(S.topic+'game_cmd',JSON.stringify({action:'go',game:'reaction',duration:duration,time:Date.now()}));
  var timeLeft=duration;
  var roundInterval=setInterval(function(){
    gameCtx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
    var sorted=Object.entries(reactionPlayers).sort(function(a,b){return b[1]-a[1]}).slice(0,10);
    gameCtx.fillStyle='#fff';gameCtx.font='bold 40px Microsoft YaHei';gameCtx.textAlign='center';
    gameCtx.fillText('⏱️ '+timeLeft+' 秒',gameCanvas.width/2,60);
    gameCtx.font='bold 28px Microsoft YaHei';
    sorted.forEach(function(e,i){var y=120+i*45;gameCtx.fillStyle=i===0?'#fdcb6e':i<3?'#fd79a8':'#fff';gameCtx.fillText((i+1)+'. '+e[0]+' - '+e[1]+'次',gameCanvas.width/2,y)});
    if(timeLeft<=0){clearInterval(roundInterval);reactionState='done';endReactionGame()}
    timeLeft--;
  },1000);
}
function endReactionGame(){
  var sorted=Object.entries(reactionPlayers).sort(function(a,b){return b[1]-a[1]}).slice(0,10);
  gameCtx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
  document.getElementById('gameDesc').textContent='游戏结束！';
  var result=document.getElementById('gameResult');
  result.innerHTML='<h2>⚡ 反应速度排名（按点击次数）</h2>'+sorted.slice(0,3).map(function(e,i){return'<div class="rank" style="background:'+['rgba(253,203,110,.2)','rgba(192,192,192,.2)','rgba(205,127,50,.2)'][i]+'">'+['🥇','🥈','🥉'][i]+' '+e[0]+' - '+e[1]+'次</div>'}).join('')||'<div class="rank" style="background:rgba(231,112,85,.2)">没有人参与</div>';
  result.classList.add('show');
  if(S.mqtt){S.mqtt.unsubscribe(S.topic+'reaction_click');S.mqtt.publish(S.topic+'game_cmd',JSON.stringify({action:'end',game:'reaction',rankings:sorted.slice(0,3).map(function(e,i){return{name:e[0],score:e[1],rank:i+1}})}))}
}

{q:'一年大约有多少周？',a:'52',options:['48','50','52','56']},
{q:'光速大约是每秒多少万公里？',a:'30',options:['15','30','50','100']}
];
function runQuizGame(){
  var rounds=(S.gameConfig&&S.gameConfig.quizRounds)||3;
  var interval=(S.gameConfig&&S.gameConfig.quizInterval)||5;
  quizState={currentRound:0,totalRounds:rounds,answers:{},current:null,scores:{},totalTime:{},roundStart:0,roundTimes:{}};
  gameCtx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
  if(S.mqtt){S.mqtt.subscribe(S.topic+'quiz_answer')}
  // 通知手机端开始抢答
  if(S.mqtt&&S.mqtt.connected){
    S.mqtt.publish(S.topic+'game_cmd',JSON.stringify({action:'start',game:'quiz',rounds:rounds,interval:interval,time:Date.now()}));
  }
  runQuizRound(0,rounds,interval);
}
function runQuizRound(roundIdx,totalRounds,interval){
  if(roundIdx>=totalRounds){endQuizGameFinal();return}
  quizState.currentRound=roundIdx+1;
  // 随机抽题
  var q=quizzes[Math.floor(Math.random()*quizzes.length)];
  quizState.current=q;quizState.answers={};quizState.roundStart=Date.now();
  // 绘制题目
  gameCtx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
  gameCtx.fillStyle='#fdcb6e';gameCtx.font='bold 36px Microsoft YaHei';gameCtx.textAlign='center';
  gameCtx.fillText('🧠 趣味抢答 第'+(roundIdx+1)+'/'+totalRounds+'轮',gameCanvas.width/2,60);
  gameCtx.fillStyle='#fff';gameCtx.font='bold 40px Microsoft YaHei';
  gameCtx.fillText(q.q,gameCanvas.width/2,160);
  q.options.forEach(function(opt,i){gameCtx.fillStyle=i===0?'#6c5ce7':i===1?'#fd79a8':i===2?'#00b894':'#0984e3';gameCtx.fillRect(gameCanvas.width/2-300,240+i*80,600,65);gameCtx.fillStyle='#fff';gameCtx.font='bold 28px Microsoft YaHei';gameCtx.fillText((['A','B','C','D'])[i]+'. '+opt,gameCanvas.width/2,280+i*80)});
  document.getElementById('gameDesc').textContent='第'+(roundIdx+1)+'轮答题中...';
  // 通知手机端题目
  if(S.mqtt&&S.mqtt.connected){
    S.mqtt.publish(S.topic+'game_cmd',JSON.stringify({action:'start',game:'quiz',round:roundIdx+1,totalRounds:totalRounds,question:q.q,options:q.options,answer:q.a,roundStart:Date.now(),time:Date.now()}));
  }
  // 等待答题时间（使用轮间间隔作为每轮答题时间）
  var answerTime=interval*1000;
  setTimeout(function(){
    if(!S.gameRunning){return}
    // 记录本轮结果
    var roundEnd=Date.now();
    var correct=Object.entries(quizState.answers).filter(function(e){return e[1]===q.a});
    // 记录每人本轮用时
    Object.keys(quizState.answers).forEach(function(name){
      var answerTimeForUser=quizState.roundTimes[name]||(roundEnd-quizState.roundStart);
      if(!quizState.totalTime[name])quizState.totalTime[name]=0;
      if(quizState.answers[name]===q.a){
        // 答对：加实际用时
        quizState.totalTime[name]+=answerTimeForUser;
      }else{
        // 答错：加间隔的1.2倍
        quizState.totalTime[name]+=Math.round(interval*1.2*1000);
      }
    });
    // 显示本轮结果
    gameCtx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
    gameCtx.fillStyle='#00b894';gameCtx.font='bold 40px Microsoft YaHei';gameCtx.textAlign='center';
    gameCtx.fillText('第'+(roundIdx+1)+'轮结束',gameCanvas.width/2,80);
    gameCtx.fillStyle='#fff';gameCtx.font='bold 32px Microsoft YaHei';
    gameCtx.fillText('正确答案：'+q.a,gameCanvas.width/2,150);
    var yPos=220;
    correct.slice(0,5).forEach(function(e,i){
      gameCtx.fillStyle=i===0?'#fdcb6e':'#fff';gameCtx.font='bold 24px Microsoft YaHei';
      gameCtx.fillText((i+1)+'. '+e[0],gameCanvas.width/2,yPos);yPos+=40;
    });
    document.getElementById('gameDesc').textContent='正确答案：'+q.a+'  答对'+correct.length+'人';
    // 通知手机端本轮结束
    if(S.mqtt&&S.mqtt.connected){
      S.mqtt.publish(S.topic+'game_cmd',JSON.stringify({action:'round_end',game:'quiz',round:roundIdx+1,correct:q.a,correctNames:correct.map(function(e){return e[0]}),time:Date.now()}));
    }
    // 间隔后开始下一轮
    setTimeout(function(){
      if(S.gameRunning){runQuizRound(roundIdx+1,totalRounds,interval)}
    },3000);
  },answerTime);
}
function endQuizGameFinal(){
  // 按总时长升序排名
  var sorted=Object.entries(quizState.totalTime).sort(function(a,b){return a[1]-b[1]}).slice(0,10);
  document.getElementById('gameDesc').textContent='抢答全部结束！';
  var result=document.getElementById('gameResult');
  result.innerHTML='<h2>🧠 趣味抢答总排名</h2><div style="color:#aaa;font-size:.85em;margin-bottom:10px">按总答题时长排名（短者优先，答错/超时按轮间间隔1.2倍计）</div>'+sorted.slice(0,3).map(function(e,i){return '<div class="rank" style="background:'+['rgba(253,203,110,.2)','rgba(192,192,192,.2)','rgba(205,127,50,.2)'][i]+'">'+['🥇','🥈','🥉'][i]+' '+e[0]+' - '+(e[1]/1000).toFixed(1)+'秒</div>'}).join('')||'<div class="rank">无人参与</div>';
  result.classList.add('show');
  if(S.mqtt){S.mqtt.unsubscribe(S.topic+'quiz_answer');S.mqtt.publish(S.topic+'game_cmd',JSON.stringify({action:'end',game:'quiz',rankings:sorted.slice(0,3).map(function(e,i){return{name:e[0],score:e[1],rank:i+1}})}))}
}
function closeGame(){
  S.gameRunning=false;
  document.getElementById('gameOverlay').classList.remove('show');
  document.getElementById('gameResult').classList.remove('show');
  if(S.mqtt){S.mqtt.publish(S.topic+'game_cmd',JSON.stringify({action:'close'}))}
  gameCtx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
}

// ========== 抽奖（广播到其他端）==========
function startDraw(){
  if(!S.luckyList.length){toast('当前无幸运候选，请先执行天选规则');return}
  if(S.isDrawing)return;
  S.isDrawing=true;
  var winners=S.luckyList.map(function(d){return{name:d.name,phone:d.phone}});
  if(S.mqtt&&S.mqtt.connected){
    S.mqtt.publish(S.topic+'lottery_result',JSON.stringify({winners:winners,time:Date.now()}));
    S.mqtt.publish(S.topic+'ai_analysis',JSON.stringify({
      text:'天选规则引擎完成筛选！共'+S.addedRules.length+'条规则，命中'+S.luckyList.length+'人',
      list:S.luckyList.slice(0,50).map(function(d){return{name:d.name,phone:d.phone}})
    }));
    toast('已广播'+S.luckyList.length+'名幸运候选至大屏');
  }else{
    toast('MQTT未连接，无法广播');
  }
  launchConfetti();
  S.isDrawing=false;
}
function launchConfetti(){
  var colors=['#fd79a8','#fdcb6e','#6c5ce7','#00b894','#0984e3','#fab1a0','#a29bfe'];
  for(var i=0;i<60;i++){var c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=Math.random()*.5+'s';if(Math.random()>.5)c.style.borderRadius='50%';document.body.appendChild(c);setTimeout(function(el){return function(){el.remove()}}(c),5000)}
}

function initMusic(){
  MUSIC.audio=new Audio();
  MUSIC.audio.loop=true;
  MUSIC.audio.volume=0.4;
  MUSIC.audio.addEventListener('play',function(){MUSIC.isPlaying=true;var btn=document.getElementById('musicPlayBtn');btn.textContent='⏸';btn.classList.add('playing');document.getElementById('musicStatus').textContent='正在播放'});
  MUSIC.audio.addEventListener('pause',function(){MUSIC.isPlaying=false;var btn=document.getElementById('musicPlayBtn');btn.textContent='▶';btn.classList.remove('playing');document.getElementById('musicStatus').textContent='已暂停'});
  MUSIC.audio.addEventListener('error',function(){MUSIC.isPlaying=false;var btn=document.getElementById('musicPlayBtn');btn.textContent='▶';btn.classList.remove('playing');document.getElementById('musicStatus').textContent='加载失败'});
  renderMusicPresets();
}
function renderMusicPresets(){
  var box=document.getElementById('musicPresetList');
  box.innerHTML=MUSIC.presets.map(function(p,i){
    return'<div class="music-preset-item" data-idx="'+i+'" onclick="selectPresetMusic('+i+')">'+
      '<span style="font-size:1.1em">'+p.icon+'</span>'+
      '<span style="flex:1;color:#fff">'+p.name+'</span>'+
      '<span style="font-size:.68em;color:var(--sub);padding:2px 6px;border-radius:8px;background:rgba(255,255,255,.05)">'+p.tag+'</span>'+
    '</div>';
  }).join('');
}
function selectPresetMusic(idx){
  var p=MUSIC.presets[idx];if(!p)return;
  MUSIC.currentSrc=p.url;MUSIC.audio.src=p.url;
  MUSIC.audio.play().catch(function(){toast('音乐加载中，请稍后重试')});
  document.getElementById('musicName').textContent=p.name;
  document.querySelectorAll('.music-preset-item').forEach(function(el,i){el.classList.toggle('active',i===idx)});
  document.getElementById('musicCurrent').style.display='flex';
  document.getElementById('musicCurrentName').textContent=p.name;
  document.getElementById('musicCurrentTag').textContent=p.tag;
}
function togglePlayMusic(){
  if(!MUSIC.audio)return;
  if(!MUSIC.currentSrc){selectPresetMusic(0);return}
  if(MUSIC.isPlaying){MUSIC.audio.pause()}else{MUSIC.audio.play().catch(function(){toast('播放失败')})}
}
function setMusicVol(v){if(MUSIC.audio)MUSIC.audio.volume=v/100}
function toggleMusicPanel(){document.getElementById('musicPanel').classList.toggle('show')}
function uploadMusic(input){
  var file=input.files[0];if(!file)return;
  if(file.size>10*1024*1024){toast('文件过大，请选择10MB以内的音频');input.value='';return}
  var url=URL.createObjectURL(file);
  MUSIC.currentSrc=url;MUSIC.audio.src=url;
  MUSIC.audio.play().catch(function(){toast('播放失败')});
  document.getElementById('musicName').textContent=file.name.replace(/\.[^.]+$/,'');
  document.querySelectorAll('.music-preset-item').forEach(function(el){el.classList.remove('active')});
  document.getElementById('musicCurrent').style.display='flex';
  document.getElementById('musicCurrentName').textContent=file.name;
  document.getElementById('musicCurrentTag').textContent='自定义';
  toast('已加载: '+file.name);
  input.value='';
}
document.addEventListener('click',function(e){
  var panel=document.getElementById('musicPanel');
  var bar=document.getElementById('musicBar');
  if(panel.classList.contains('show')&&!panel.contains(e.target)&&!bar.contains(e.target)){panel.classList.remove('show')}
});

// ========== 全屏 ==========
function toggleFullscreen(){
  var el=document.documentElement;
  if(!document.fullscreenElement&&!document.webkitFullscreenElement&&!document.mozFullScreenElement){
    if(el.requestFullscreen)el.requestFullscreen();
    else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    else if(el.mozRequestFullScreen)el.mozRequestFullScreen();
    else if(el.msRequestFullscreen)el.msRequestFullscreen();
    document.getElementById('fsBtn').textContent='✖';
  }else{
    if(document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    else if(document.mozCancelFullScreen)document.mozCancelFullScreen();
    else if(document.msExitFullscreen)document.msExitFullscreen();
    document.getElementById('fsBtn').textContent='⛶';
  }
}
document.addEventListener('fullscreenchange',function(){var btn=document.getElementById('fsBtn');btn.textContent=document.fullscreenElement?'✖':'⛶'});
