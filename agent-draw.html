<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>天翼AI智能体 · 大屏抽奖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#0a0e27;color:#fff;min-height:100vh;overflow-x:hidden}
input,button,select,textarea{font-family:inherit;outline:none;border:none}
:root{--pri:#6c5ce7;--pri-l:#a29bfe;--acc:#fd79a8;--gold:#fdcb6e;--grn:#00b894;--red:#e17055;--blue:#0984e3;--card:#161b3c;--card2:#1e2550;--sub:#a0a8c8;--bd:rgba(255,255,255,.1)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--pri);border-radius:2px}
.btn{padding:10px 20px;border-radius:10px;cursor:pointer;font-size:.95em;transition:.2s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:active{background:#5a4bd1}
.btn-out{background:transparent;border:1px solid var(--bd);color:var(--sub)}.btn-out:active{border-color:var(--pri);color:#fff}
.btn-suc{background:var(--grn);color:#fff}.btn-dng{background:var(--red);color:#fff}
.btn-gold{background:var(--gold);color:#333;font-weight:bold}
.card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:14px;border:1px solid var(--bd)}
.stat-box{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat-item{flex:1;min-width:80px;text-align:center;padding:14px 8px;background:var(--card);border-radius:12px;border:1px solid var(--bd)}
.stat-num{font-size:1.6em;font-weight:bold}
.stat-label{font-size:.75em;color:var(--sub);margin-top:4px}

/* ========== 大屏模式 ========== */
body.bigscreen{background:linear-gradient(135deg,#0a0e27 0%,#1a1040 40%,#0d1a3a 70%,#0a0e27 100%);overflow-y:auto}
body.bigscreen::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(108,92,231,.15),transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(253,121,168,.1),transparent 50%);pointer-events:none;z-index:0}
body.bigscreen #app{position:relative;z-index:1;max-width:1400px;padding:20px 28px 40px}

/* 大屏标题区 */
.bs-header{text-align:center;padding:18px 0 14px;position:relative}
.bs-title{font-size:3.2em;font-weight:900;letter-spacing:6px;background:linear-gradient(135deg,#fdcb6e 0%,#fd79a8 30%,#a29bfe 60%,#74b9ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:none;animation:titleGlow 3s ease-in-out infinite alternate;line-height:1.2}
@keyframes titleGlow{from{filter:drop-shadow(0 0 6px rgba(253,203,110,.3))}to{filter:drop-shadow(0 0 18px rgba(253,203,110,.6))}}
.bs-subtitle{font-size:1.05em;color:var(--sub);letter-spacing:4px;margin-top:4px}
.bs-header-line{width:60%;max-width:500px;height:2px;margin:10px auto 0;background:linear-gradient(90deg,transparent,var(--pri),var(--gold),var(--pri),transparent)}

/* 顶部工具栏 */
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* 全屏按钮 */
.fs-btn{position:fixed;top:16px;right:16px;z-index:9000;width:46px;height:46px;border-radius:12px;background:rgba(22,27,60,.8);border:1px solid var(--bd);color:var(--sub);cursor:pointer;font-size:1.3em;display:flex;align-items:center;justify-content:center;transition:.2s;backdrop-filter:blur(8px)}
.fs-btn:hover{background:var(--pri);color:#fff;border-color:var(--pri);transform:scale(1.05)}
.fs-btn:active{transform:scale(.95)}

/* 音乐控制栏 */
.music-bar{position:fixed;bottom:16px;left:16px;z-index:9000;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:24px;background:rgba(22,27,60,.85);border:1px solid var(--bd);backdrop-filter:blur(8px);font-size:.82em;color:var(--sub);transition:.2s;max-width:340px}
.music-bar:hover{border-color:var(--pri)}
.music-play-btn{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;cursor:pointer;font-size:1em;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.music-play-btn:hover{background:var(--pri-l);transform:scale(1.05)}
.music-play-btn.playing{background:var(--grn)}
.music-info{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.music-info .music-name{color:#fff;font-weight:bold;font-size:.88em}
.music-info .music-status{font-size:.72em;color:var(--sub)}
.music-vol{width:60px;height:4px;-webkit-appearance:none;appearance:none;background:var(--card2);border-radius:2px;cursor:pointer;flex-shrink:0}
.music-vol::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold);cursor:pointer}
.music-more-btn{width:30px;height:30px;border-radius:8px;background:transparent;border:1px solid var(--bd);color:var(--sub);cursor:pointer;font-size:.9em;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.music-more-btn:hover{background:var(--card2);color:#fff}

/* 音乐面板（展开） */
.music-panel{position:fixed;bottom:62px;left:16px;z-index:9000;width:320px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;backdrop-filter:blur(12px);display:none;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.music-panel.show{display:block;animation:slideUp .2s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.music-panel-title{font-size:.9em;font-weight:bold;color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.music-preset-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.music-preset-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--card2);cursor:pointer;transition:.15s;font-size:.82em}
.music-preset-item:hover{background:rgba(108,92,231,.3)}
.music-preset-item.active{background:rgba(108,92,231,.3);border:1px solid var(--pri)}
.music-preset-item .preset-icon{font-size:1.1em;flex-shrink:0}
.music-preset-item .preset-name{flex:1;color:#fff}
.music-preset-item .preset-tag{font-size:.68em;color:var(--sub);padding:2px 6px;border-radius:8px;background:rgba(255,255,255,.05)}
.music-divider{height:1px;background:var(--bd);margin:10px 0}
.music-upload-area{border:2px dashed var(--bd);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:.2s}
.music-upload-area:hover{border-color:var(--pri);background:rgba(108,92,231,.05)}
.music-upload-area .upload-icon{font-size:1.8em;margin-bottom:4px}
.music-upload-area .upload-text{font-size:.78em;color:var(--sub)}
.music-upload-area .upload-hint{font-size:.68em;color:var(--sub);margin-top:2px;opacity:.7}
.music-current{font-size:.78em;color:var(--sub);margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--card2);display:flex;align-items:center;gap:6px}
.music-current .current-name{color:var(--gold);font-weight:bold;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 智能体动画 */
.agent-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--acc));display:flex;align-items:center;justify-content:center;font-size:2em;flex-shrink:0;position:relative}
.agent-avatar.thinking{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(108,92,231,.4)}50%{transform:scale(1.08);box-shadow:0 0 0 12px rgba(108,92,231,0)}}
.agent-avatar.done{background:linear-gradient(135deg,var(--grn),var(--gold))}
.agent-avatar.error{background:linear-gradient(135deg,var(--red),var(--gold))}

/* 日志流 */
.log-stream{max-height:320px;overflow-y:auto;padding:4px 0}
.log-item{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;margin-bottom:4px;border-radius:8px;background:var(--card2);font-size:.85em;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.log-icon{font-size:1.1em;flex-shrink:0;margin-top:1px}
.log-text{flex:1;line-height:1.5}
.log-time{font-size:.72em;color:var(--sub);flex-shrink:0;margin-top:2px}

/* 步骤指示器 */
.step-flow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.step-pill{padding:6px 14px;border-radius:20px;background:var(--card2);border:1px solid var(--bd);font-size:.78em;color:var(--sub);transition:.3s}
.step-pill.active{border-color:var(--pri);background:rgba(108,92,231,.2);color:var(--pri-l)}
.step-pill.done{border-color:var(--grn);background:rgba(0,184,148,.15);color:var(--grn)}
.step-pill.fail{border-color:var(--red);background:rgba(225,112,85,.15);color:var(--red)}

/* 候选人滚动展示 */
.candidate-scroll{display:flex;gap:8px;overflow:hidden;white-space:nowrap;padding:12px 0;mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.candidate-chip{padding:8px 16px;border-radius:20px;background:var(--card2);border:1px solid var(--bd);font-size:.85em;flex-shrink:0;transition:.2s}
.candidate-chip.hit{border-color:var(--gold);background:rgba(253,203,110,.15);color:var(--gold);font-weight:bold;transform:scale(1.05)}
.candidate-chip.miss{opacity:.4}
.candidate-chip.winner{border-color:var(--grn);background:rgba(0,184,148,.2);color:var(--grn);font-weight:bold;animation:bounce .5s ease}
@keyframes bounce{0%{transform:scale(.8)}50%{transform:scale(1.15)}100%{transform:scale(1.05)}}

/* 中奖结果 */
.winner-card{background:linear-gradient(135deg,rgba(253,203,110,.15),rgba(0,184,148,.1));border:2px solid var(--gold);border-radius:20px;padding:24px;text-align:center;animation:zoomIn .5s ease}
@keyframes zoomIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.winner-avatar{width:72px;height:72px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:2em;font-weight:bold;color:#333;margin:0 auto 12px}
.winner-name{font-size:1.8em;font-weight:bold;color:var(--gold);margin-bottom:6px}
.winner-detail{font-size:.85em;color:var(--sub);line-height:1.8}

/* 数字拆解可视化 */
.digit-viz{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.digit-box{width:36px;height:36px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:1.2em;font-weight:bold;font-family:monospace;transition:.3s}
.digit-box.from-phone{border-color:var(--blue);color:var(--blue)}
.digit-box.from-ticket{border-color:var(--acc);color:var(--acc)}
.digit-box.sum-target{border-color:var(--gold);background:rgba(253,203,110,.15);color:var(--gold)}

/* 规则配置 */
.rule-config{background:var(--card2);border-radius:12px;padding:16px;margin-bottom:14px}
.rule-config label{display:block;font-size:.82em;color:var(--sub);margin-bottom:4px}
.rule-config input,.rule-config select{width:100%;padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--bd);color:#fff;font-size:.9em}
.rule-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.rule-row>div{flex:1;min-width:120px}

/* 大屏模式统计放大 */
body.bigscreen .stat-num{font-size:2.2em}
body.bigscreen .stat-item{padding:18px 10px}
body.bigscreen .stat-label{font-size:.85em}
body.bigscreen .step-pill{padding:8px 18px;font-size:.88em}
body.bigscreen .card{padding:24px}
body.bigscreen .rule-config input,body.bigscreen .rule-config select{padding:12px 14px;font-size:1em}
body.bigscreen .btn-gold{padding:16px;font-size:1.25em}
body.bigscreen .log-stream{max-height:400px}
body.bigscreen .log-item{font-size:.95em;padding:10px 14px}
body.bigscreen .winner-name{font-size:2.5em}
body.bigscreen .winner-avatar{width:90px;height:90px;font-size:2.5em}
body.bigscreen .winner-detail{font-size:1em}
body.bigscreen .digit-box{width:44px;height:44px;font-size:1.5em}
body.bigscreen .candidate-chip{padding:10px 20px;font-size:.95em}

/* 进度条 */
.progress-track{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--gold));transition:width .5s ease;border-radius:3px}
</style>
</head>
<body class="bigscreen">
<!-- 全屏按钮 -->
<button class="fs-btn" id="fsBtn" onclick="toggleFullscreen()" title="全屏/退出全屏">⛶</button>

<!-- 音乐控制栏 -->
<div class="music-bar" id="musicBar">
  <div class="music-play-btn" id="musicPlayBtn" onclick="togglePlayMusic()">▶</div>
  <div class="music-info">
    <div class="music-name" id="musicName">未选择音乐</div>
    <div class="music-status" id="musicStatus">点击右侧按钮选择</div>
  </div>
  <input type="range" class="music-vol" id="musicVol" min="0" max="100" value="40" oninput="setMusicVol(this.value)">
  <button class="music-more-btn" id="musicMoreBtn" onclick="toggleMusicPanel()">🎵</button>
</div>

<!-- 音乐面板 -->
<div class="music-panel" id="musicPanel">
  <div class="music-panel-title">🎵 背景音乐</div>
  <div class="music-preset-list" id="musicPresetList"></div>
  <div class="music-divider"></div>
  <div class="music-upload-area" onclick="document.getElementById('musicFileInput').click()">
    <div class="upload-icon">📁</div>
    <div class="upload-text">点击上传自定义音乐</div>
    <div class="upload-hint">支持 MP3 / WAV / OGG 格式</div>
  </div>
  <input type="file" id="musicFileInput" accept="audio/*" style="display:none" onchange="uploadMusic(this)">
  <div class="music-current" id="musicCurrent" style="display:none">
    <span>🎶</span>
    <span class="current-name" id="musicCurrentName"></span>
    <span style="font-size:.72em;color:var(--grn)" id="musicCurrentTag"></span>
  </div>
</div>

<div id="app" style="max-width:1400px;margin:0 auto;padding:20px 28px 80px;min-height:100vh">
  <!-- 大屏标题 -->
  <div class="bs-header">
    <div class="bs-title">天翼AI智能体</div>
    <div class="bs-subtitle">AI Smart Agent Lottery System</div>
    <div class="bs-header-line"></div>
  </div>

  <!-- 顶部状态栏 -->
  <div class="top-bar" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="agent-avatar" id="agentIcon" style="width:48px;height:48px;font-size:1.5em">🤖</div>
      <div>
        <div style="font-weight:bold;font-size:1.1em">智能体抽奖引擎</div>
        <div style="font-size:.75em;color:var(--sub)">AI Rule-Based Lottery</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="display:flex;align-items:center;gap:4px;font-size:.75em;padding:4px 10px;border-radius:16px;background:rgba(255,255,255,.05)"><div id="mDot" style="width:6px;height:6px;border-radius:50%;background:#555"></div><span id="mText">连接中</span></div>
      <button class="btn btn-out" style="padding:6px 12px;font-size:.8em" onclick="resetEngine()">重置</button>
    </div>
  </div>

  <!-- 统计概览 -->
  <div class="stat-box" id="overviewStats">
    <div class="stat-item"><div class="stat-num" id="sTotal" style="color:var(--gold)">0</div><div class="stat-label">总参与者</div></div>
    <div class="stat-item"><div class="stat-num" id="sSigned" style="color:var(--grn)">0</div><div class="stat-label">已签到</div></div>
    <div class="stat-item"><div class="stat-num" id="sQuiz" style="color:var(--pri-l)">0</div><div class="stat-label">已答题</div></div>
    <div class="stat-item"><div class="stat-num" id="sEligible" style="color:var(--acc)">0</div><div class="stat-label">抽奖候选</div></div>
  </div>

  <!-- 步骤流程指示 -->
  <div class="step-flow" id="stepFlow">
    <div class="step-pill" id="step1">① 数据加载</div>
    <div class="step-pill" id="step2">② 筛选签到</div>
    <div class="step-pill" id="step3">③ 校验答题</div>
    <div class="step-pill" id="step4">④ 排除中奖</div>
    <div class="step-pill" id="step5">⑤ 数字运算</div>
    <div class="step-pill" id="step6">⑥ 命中抽取</div>
    <div class="step-pill" id="step7">⑦ 结果呈现</div>
  </div>

  <!-- 规则配置区 -->
  <div class="card" id="ruleConfigCard">
    <div style="font-weight:bold;margin-bottom:12px">📋 抽奖规则配置</div>
    <div class="rule-config">
      <div class="rule-row">
        <div><label>数字运算规则</label><input id="ruleCalc" placeholder="如：全部数字相加等于5" value="全部数字相加等于5"></div>
        <div><label>中奖人数</label><input id="ruleWinCount" type="number" value="1" min="1" style="width:80px"></div>
      </div>
      <div class="rule-row">
        <div><label>筛选条件</label>
          <select id="ruleFilter">
            <option value="all" selected>已签到 + 已答题 + 未中奖</option>
            <option value="signed">仅已签到</option>
            <option value="quiz">仅已答题</option>
            <option value="none">不筛选</option>
          </select>
        </div>
        <div><label>抽取方式</label>
          <select id="ruleMode">
            <option value="match" selected>规则匹配（满足条件的全部命中）</option>
            <option value="random">规则筛选后随机抽取</option>
            <option value="best">取答题成绩最佳</option>
          </select>
        </div>
      </div>
    </div>
    <button class="btn btn-gold" style="width:100%;padding:14px;font-size:1.1em" id="runBtn" onclick="runLottery()">🚀 启动智能体抽奖</button>
  </div>

  <!-- 候选人滚动展示区 -->
  <div class="card" id="candidateCard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:bold">🎯 候选人池</div>
      <div style="font-size:.82em;color:var(--sub)" id="candidateCount">0 人</div>
    </div>
    <div class="candidate-scroll" id="candidateScroll"></div>
  </div>

  <!-- 智能体日志流 -->
  <div class="card" id="logCard" style="display:none">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div class="agent-avatar thinking" id="agentLogIcon" style="width:40px;height:40px;font-size:1.3em">🤖</div>
      <div>
        <div style="font-weight:bold;font-size:.95em">智能体分析中...</div>
        <div style="font-size:.78em;color:var(--sub)" id="agentStatus">正在处理数据</div>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="logProgress" style="width:0%"></div></div>
    <div class="log-stream" id="logStream"></div>
  </div>

  <!-- 中奖结果区 -->
  <div id="resultArea" style="display:none"></div>
</div>

<div id="toast" style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:30px;background:rgba(0,0,0,.85);z-index:9999;font-size:.9em;opacity:0;transition:.3s;pointer-events:none"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<script>
let S={
  mqtt:null,topic:'',room:'',
  configReceived:false,
  allParticipants:[],
  allQuizResults:[],
  lotteryRule:null,
  isRunning:false,
  _retryTimer:null
};
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function toast(m,d=2000){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',d)}
function maskPhone(p){if(!p)return'';return p.substr(0,3)+'XXXX'+p.substr(-4)}
function fmtTime(ms){return(ms/1000).toFixed(2)+'s'}

// ========== 工具：数字拆解 ==========
function extractDigits(str){if(!str)return[];return String(str).replace(/\D/g,'').split('').map(function(d){return parseInt(d)})}
function digitSum(arr){return arr.reduce(function(a,b){return a+b},0)}

// ========== 初始化 ==========
(function init(){
  const p=new URLSearchParams(location.search);S.room=p.get('room')||'demo';S.topic='cj2026/'+S.room+'/';
  connectMQTT();
})();

// ========== MQTT ==========
function connectMQTT(){
  const cid='agentdraw_'+uid();
  try{
    S.mqtt=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:cid,keepalive:30,clean:true,reconnectPeriod:3000,connectTimeout:10000});
    S.mqtt.on('connect',()=>{
      updateMqtt('online');
      S.mqtt.subscribe(S.topic+'config');
      S.mqtt.subscribe(S.topic+'lottery_result');
      S.mqtt.publish(S.topic+'request_config',JSON.stringify({type:'request',from:'agent-draw',time:Date.now()}));
      if(S._retryTimer)clearInterval(S._retryTimer);
      S._retryTimer=setInterval(()=>{
        if(S.mqtt&&S.mqtt.connected&&!S.configReceived){
          S.mqtt.publish(S.topic+'request_config',JSON.stringify({type:'request',from:'agent-draw',time:Date.now()}));
        }else if(S.configReceived&&S._retryTimer){
          clearInterval(S._retryTimer);S._retryTimer=null;
        }
      },5000);
    });
    S.mqtt.on('message',(t,m)=>{try{const d=JSON.parse(m.toString());handleMsg(t,d)}catch(e){}});
    S.mqtt.on('error',()=>updateMqtt('offline'));S.mqtt.on('reconnect',()=>updateMqtt('connecting'));S.mqtt.on('close',()=>updateMqtt('offline'));
  }catch(e){updateMqtt('offline')}
}

// ========== 数字运算匹配 ==========
function matchRule(p,ruleDesc){
  if(!ruleDesc)return true;
  var pc=p.preCalc;
  if(!pc){
    // 即时计算
    var digits=extractDigits(p.phone);
    pc={totalSum:digitSum(digits),allEven:digitSum(digits)%2===0};
  }
  var d=ruleDesc;
  // 全部数字相加等于N
  var m=d.match(/全部.*(?:数字)?.*(?:相加|和).*(?:等于|为|是)\s*(\d+)/);
  if(m)return pc.totalSum===parseInt(m[1]);
  // 全部数字相加为偶/奇
  if(/全部.*(?:数字)?.*(?:相加|和).*(?:偶|双)/.test(d))return pc.allEven;
  if(/全部.*(?:数字)?.*(?:相加|和).*(?:奇|单)/.test(d))return !pc.allEven;
  return true;
}

// ========== 核心：智能体抽奖流程 ==========
async function runLottery(){
  if(S.isRunning)return;
  S.isRunning=true;

  var ruleCalc=document.getElementById('ruleCalc').value.trim();
  var winCount=parseInt(document.getElementById('ruleWinCount').value)||1;
  var filterMode=document.getElementById('ruleFilter').value;
  var drawMode=document.getElementById('ruleMode').value;

  // UI 初始化
  document.getElementById('runBtn').disabled=true;
  document.getElementById('runBtn').textContent='⏳ 抽奖进行中...';
  document.getElementById('logCard').style.display='block';
  document.getElementById('candidateCard').style.display='block';
  document.getElementById('resultArea').style.display='none';
  document.getElementById('logStream').innerHTML='';
  document.getElementById('agentLogIcon').className='agent-avatar thinking';
  document.getElementById('agentLogIcon').textContent='🤖';
  resetSteps();
  setStep(1,'active');
  setProgress(5);

  var t0=Date.now();
  addLog('📡','智能体正在连接数据源...');

  await sleep(300);

  // === Step 1: 数据加载 ===
  setAgentStatus('正在加载参与者与答题数据');
  var allList=S.allParticipants.slice();
  addLog('📊','已加载 '+allList.length+' 名参与者数据');
  await sleep(200);
  addLog('🧠','已加载 '+S.allQuizResults.length+' 条答题记录（含多轮最佳成绩）');
  setStep(1,'done');
  setStep(2,'active');
  setProgress(15);

  await sleep(300);

  // === Step 2: 签到筛选 ===
  setAgentStatus('正在筛选已签到人员');
  var signedList=allList;
  if(filterMode==='all'||filterMode==='signed'){
    signedList=allList.filter(function(p){return p.signed});
    var removedSign=allList.length-signedList.length;
    addLog('✅','签到筛选：'+signedList.length+' 人已签到'+(removedSign>0?'（淘汰 '+removedSign+' 人未签到）':''));
  }else{
    addLog('⏭️','跳过签到筛选');
  }
  setStep(2,'done');
  setStep(3,'active');
  setProgress(30);

  await sleep(300);

  // === Step 3: 答题校验 ===
  setAgentStatus('正在校验知识问答完成情况');
  var quizSet={};
  S.allQuizResults.forEach(function(q){quizSet[(q.name||'')+'|'+(q.phone||'')]=q});
  var quizList=signedList;
  if(filterMode==='all'||filterMode==='quiz'){
    quizList=signedList.filter(function(p){return quizSet[(p.name||'')+'|'+(p.phone||'')]});
    var removedQuiz=signedList.length-quizList.length;
    addLog('🧠','答题校验：'+quizList.length+' 人已完成知识问答'+(removedQuiz>0?'（淘汰 '+removedQuiz+' 人未答题）':''));
  }else{
    addLog('⏭️','跳过答题校验');
  }
  setStep(3,'done');
  setStep(4,'active');
  setProgress(45);

  await sleep(300);

  // === Step 4: 排除已中奖 ===
  setAgentStatus('正在排除已中奖人员');
  var notWonList=quizList;
  if(filterMode==='all'){
    notWonList=quizList.filter(function(p){return !p.won});
    var removedWon=quizList.length-notWonList.length;
    addLog('🏆','排除已中奖：'+notWonList.length+' 人为有效候选'+(removedWon>0?'（排除 '+removedWon+' 人已中奖）':''));
  }
  setStep(4,'done');
  setStep(5,'active');
  setProgress(60);

  await sleep(300);

  // 展示候选人池
  renderCandidates(notWonList);
  document.getElementById('candidateCount').textContent=notWonList.length+' 人';
  await sleep(500);

  // === Step 5: 数字运算 ===
  setAgentStatus('正在执行数字运算规则：'+ruleCalc);
  addLog('🔢','开始执行数字运算规则：「'+ruleCalc+'」');
  await sleep(300);

  var matched=notWonList.filter(function(p){
    var hit=matchRule(p,ruleCalc);
    var pc=p.preCalc||{};
    var sum=pc.totalSum||0;
    if(hit){
      addLog('🎯','<b style="color:var(--gold)">'+p.name+'</b>（'+maskPhone(p.phone)+'）数字之和='+sum+' ✅ 命中');
    }
    return hit;
  });
  
  if(matched.length===0){
    addLog('❌','数字运算规则未命中任何候选人');
  }else{
    addLog('✅','数字运算完成：'+matched.length+' 人命中规则');
  }
  setStep(5,'done');
  setStep(6,'active');
  setProgress(75);

  await sleep(500);

  // === Step 6: 命中抽取 ===
  setAgentStatus('正在进行最终抽取');
  var winners=[];
  if(drawMode==='match'){
    // 规则匹配：满足条件的全部命中
    winners=matched.slice(0,winCount);
    if(matched.length>winCount){
      // 如果命中多于需要人数，随机选取
      addLog('🎲','命中 '+matched.length+' 人超出中奖名额 '+winCount+'，随机抽取...');
      winners=[];
      var pool=matched.slice();
      for(var i=0;i<Math.min(winCount,pool.length);i++){
        var idx=Math.floor(Math.random()*pool.length);
        winners.push(pool.splice(idx,1)[0]);
      }
    }
  }else if(drawMode==='random'){
    // 规则筛选后随机抽取
    var pool2=matched.length?matched:notWonList;
    addLog('🎲','从 '+(pool2.length)+' 名候选中随机抽取 '+winCount+' 人');
    winners=[];
    var p2=pool2.slice();
    for(var i=0;i<Math.min(winCount,p2.length);i++){
      var idx2=Math.floor(Math.random()*p2.length);
      winners.push(p2.splice(idx2,1)[0]);
    }
  }else if(drawMode==='best'){
    // 取答题成绩最佳
    var scoreboard=notWonList.map(function(p){
      var q=quizSet[(p.name||'')+'|'+(p.phone||'')];
      return{p:p,correct:q?q.correctCount:0,time:q?q.totalTimeMs:999999999};
    }).sort(function(a,b){return b.correct-a.correct||(a.time-b.time)});
    winners=scoreboard.slice(0,winCount).map(function(s){return s.p});
    addLog('🏆','按答题成绩最佳选取：'+winners.map(function(w){return w.name}).join('、'));
  }

  // 标记候选人状态
  renderCandidateResult(notWonList,winners);

  setStep(6,'done');
  setStep(7,'active');
  setProgress(90);

  await sleep(500);

  // === Step 7: 结果呈现 ===
  setAgentStatus('正在生成抽奖结果');
  var totalTime=Date.now()-t0;
  addLog('🎉','抽奖完成！耗时 '+totalTime+'ms');

  // 广播中奖结果
  if(S.mqtt&&S.mqtt.connected&&winners.length){
    S.mqtt.publish(S.topic+'lottery_result',JSON.stringify({
      winners:winners.map(function(w){return{name:w.name,prize:'智能体抽奖'}}),
      time:Date.now()
    }));
    addLog('📡','中奖结果已广播至全部终端');
  }

  setStep(7,'done');
  setProgress(100);
  document.getElementById('agentLogIcon').className='agent-avatar done';
  document.getElementById('agentLogIcon').textContent='✅';
  setAgentStatus('抽奖完成');

  // 渲染中奖结果
  renderWinners(winners,ruleCalc,totalTime);

  // 恢复按钮
  document.getElementById('runBtn').disabled=false;
  document.getElementById('runBtn').textContent='🚀 再次启动抽奖';
  S.isRunning=false;
}

// ========== 中奖结果渲染 ==========
function renderWinners(winners,ruleCalc,totalTime){
  var area=document.getElementById('resultArea');
  area.style.display='block';
  if(!winners.length){
    area.innerHTML='<div class="card" style="text-align:center;padding:40px"><div style="font-size:3em;margin-bottom:12px">😢</div><div style="font-size:1.2em;color:var(--sub)">本轮无人中奖</div><div style="font-size:.85em;color:var(--sub);margin-top:8px">规则「'+ruleCalc+'」未匹配到任何候选人</div></div>';
    return;
  }
  var html='<div style="text-align:center;margin-bottom:16px"><div style="font-size:2em;margin-bottom:8px">🎊</div><div style="font-size:1.4em;font-weight:bold;color:var(--gold)">恭喜以下中奖者！</div></div>';
  winners.forEach(function(w,i){
    var pc=w.preCalc||{};
    var phoneDigits=extractDigits(w.phone);
    var ticketDigits=extractDigits(w.ticket||'');
    var allDigits=phoneDigits.concat(ticketDigits);
    var totalSum=pc.totalSum||digitSum(allDigits);
    var teamInfo=w.team||'';
    var qResult=S.allQuizResults.find(function(q){return q.name===w.name&&q.phone===w.phone});
    var accuracy=qResult&&qResult.totalCount>0?Math.round(qResult.correctCount/qResult.totalCount*100):0;

    html+='<div class="winner-card" style="margin-bottom:14px">';
    html+='<div class="winner-avatar">'+((w.name||'?')[0])+'</div>';
    html+='<div class="winner-name">'+w.name+'</div>';
    if(teamInfo)html+='<div style="font-size:.85em;color:var(--pri-l);margin-bottom:8px">['+teamInfo+']</div>';
    html+='<div class="winner-detail">';
    html+='手机号：'+maskPhone(w.phone)+'<br>';
    if(qResult)html+='答题成绩：'+qResult.correctCount+'/'+qResult.totalCount+'（正确率 '+accuracy+'%）<br>';
    html+='</div>';
    // 数字拆解可视化
    html+='<div style="margin-top:14px;font-size:.82em;color:var(--sub)">数字拆解验证：</div>';
    html+='<div class="digit-viz">';
    phoneDigits.forEach(function(d){
      html+='<div class="digit-box from-phone">'+d+'</div>';
    });
    if(ticketDigits.length){
      html+='<div style="display:flex;align-items:center;color:var(--sub);font-size:1.2em;padding:0 4px">+</div>';
      ticketDigits.forEach(function(d){
        html+='<div class="digit-box from-ticket">'+d+'</div>';
      });
    }
    html+='<div style="display:flex;align-items:center;color:var(--sub);font-size:1.2em;padding:0 4px">=</div>';
    html+='<div class="digit-box sum-target" style="width:48px">'+totalSum+'</div>';
    html+='</div>';
    html+='<div style="font-size:.78em;color:'+(totalSum===5?'var(--grn)':'var(--gold)')+';margin-top:6px">'+(totalSum===5?'✅ 数字之和为5，符合抽奖规则！':'数字之和：'+totalSum)+'</div>';
    html+='</div>';
  });
  html+='<div style="text-align:center;font-size:.8em;color:var(--sub);padding:12px">规则：「'+ruleCalc+'」 · 耗时 '+totalTime+'ms · 智能体抽奖引擎</div>';
  area.innerHTML=html;
}

    toast('播放失败，请重试');
  });
  document.getElementById('musicName').textContent=MUSIC.currentName;
  document.querySelectorAll('.music-preset-item').forEach(function(el){el.classList.remove('active')});
  showMusicCurrent(MUSIC.currentName,'自定义');
  toast('已加载: '+MUSIC.currentName);
  input.value='';
}
function showMusicCurrent(name,tag){
  var box=document.getElementById('musicCurrent');
  document.getElementById('musicCurrentName').textContent=name;
  document.getElementById('musicCurrentTag').textContent=tag;
  box.style.display='flex';
}
// 点击页面其他区域关闭音乐面板
document.addEventListener('click',function(e){
  var panel=document.getElementById('musicPanel');
  var bar=document.getElementById('musicBar');
  if(panel.classList.contains('show')&&!panel.contains(e.target)&&!bar.contains(e.target)){
    panel.classList.remove('show');
  }
});

// ========== 初始化大屏 ==========
window.addEventListener('DOMContentLoaded',function(){
  initMusic();
  applyBigscreenStats();
});

</script>
</body>
</html>
