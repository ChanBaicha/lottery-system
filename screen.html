<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>抽奖大屏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;overflow:hidden;background:#0a0e27;color:#fff;user-select:none}
:root{--pri:#6c5ce7;--acc:#fd79a8;--gold:#fdcb6e;--grn:#00b894;--red:#e17055}
::-webkit-scrollbar{display:none}
#stage{position:fixed;top:0;left:0;width:100vw;height:100vh;overflow:hidden}
#bgLayer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0}
#bgLayer img{width:100%;height:100%;object-fit:cover}
#bgLayer::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(10,14,39,.3)}

/* 标题 */
#titleBar{position:relative;z-index:10;text-align:center;padding:20px}
#mainTitle{font-weight:bold;text-shadow:0 0 30px rgba(253,203,110,.3);transition:all .3s}
#signedCounter{display:inline-block;margin-top:8px;padding:4px 18px;border-radius:20px;background:rgba(255,255,255,.1);font-size:.9em}

/* 流动动画容器 */
#flowContainer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none}
#flowCanvas{position:absolute;top:0;left:0;width:100%;height:100%}

/* 自定义元素 */
.custom-el{position:absolute;z-index:8;cursor:move;border:2px dashed transparent;transition:border-color .2s}
.custom-el:hover{border-color:rgba(108,92,231,.5)}
.custom-el.selected{border-color:var(--pri)}
.custom-el .el-text{white-space:nowrap}
.custom-el .resize-handle{position:absolute;bottom:0;right:0;width:16px;height:16px;background:var(--pri);border-radius:50%;cursor:nwse-resize;display:none}
.custom-el.selected .resize-handle{display:block}

/* 弹幕层 */
#danmakuLayer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;pointer-events:none;overflow:hidden}
.dm-item{position:absolute;white-space:nowrap;font-weight:bold;text-shadow:1px 1px 3px rgba(0,0,0,.8);animation:dmScroll linear forwards}
@keyframes dmScroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.dm-avatar{display:inline-block;width:1.6em;height:1.6em;border-radius:50%;overflow:hidden;vertical-align:middle;margin-right:8px;background:rgba(255,255,255,.15)}
.dm-avatar img{width:100%;height:100%;object-fit:cover}
.dm-avatar-emoji{display:inline-flex;align-items:center;justify-content:center;font-size:1.2em;line-height:1}
.dm-nick{font-weight:bold;margin-right:6px;opacity:.9}

/* 控制栏 */
#ctrlBar{position:fixed;bottom:0;left:0;width:100%;z-index:100;display:flex;justify-content:center;gap:12px;padding:14px;background:linear-gradient(transparent,rgba(10,14,39,.9))}
.ctrl-btn{padding:12px 28px;border-radius:30px;cursor:pointer;font-size:1em;font-weight:bold;transition:.3s;display:flex;align-items:center;gap:8px}
.ctrl-btn:hover{transform:translateY(-2px)}
.btn-draw{background:linear-gradient(135deg,#fd79a8,#6c5ce7);color:#fff;box-shadow:0 4px 20px rgba(253,121,168,.4)}
.btn-game{background:linear-gradient(135deg,#fdcb6e,#e17055);color:#333}
.btn-flow{background:rgba(255,255,255,.12);color:#fff}
.btn-draw:disabled{opacity:.5;cursor:not-allowed}

/* 抽奖动画 */
#drawOverlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85)}
#drawOverlay.show{display:flex}
.draw-pool{width:80%;max-width:900px;text-align:center}
.draw-names{font-size:3em;font-weight:bold;margin:20px 0;min-height:120px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.draw-name-item{padding:10px 30px;border-radius:20px;background:rgba(108,92,231,.2);border:2px solid var(--pri);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.draw-result{display:none}
.draw-result.show{display:block;animation:zoomIn .5s ease}
@keyframes zoomIn{0%{transform:scale(.3);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.winner-card{background:linear-gradient(135deg,rgba(253,203,110,.15),rgba(253,121,168,.15));border:2px solid var(--gold);border-radius:20px;padding:30px;margin:20px auto;max-width:600px}
.winner-item{display:inline-flex;align-items:center;gap:10px;margin:10px 20px;padding:12px 24px;border-radius:16px;background:rgba(253,203,110,.1);border:1px solid rgba(253,203,110,.3)}
.winner-avatar{width:50px;height:50px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden}
.winner-name{font-size:1.4em;font-weight:bold}
.winner-prize{color:var(--gold);font-size:1.2em;margin-top:12px}

/* 抽奖准备阶段 */
#drawReady{display:none;text-align:center}
#drawReady.show{display:block}
.draw-ready-prize{display:inline-block;padding:30px 50px;border-radius:24px;background:linear-gradient(135deg,rgba(108,92,231,.15),rgba(253,203,110,.15));border:3px solid var(--gold);margin:20px}
.draw-ready-img{width:120px;height:120px;border-radius:16px;object-fit:cover;margin:0 auto 16px;display:block}
.draw-ready-name{font-size:2.5em;font-weight:bold;color:var(--gold);margin-bottom:12px}
.draw-ready-info{font-size:1.2em;color:#fff;margin-bottom:16px}
.draw-ready-count{font-size:2em;font-weight:bold;color:var(--pri-l,#a29bfe)}
.draw-ready-hint{font-size:.85em;color:rgba(255,255,255,.6);margin-top:16px}

/* 中奖人删除按钮 */
.winner-delete-btn{background:var(--red);color:#fff;border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:1em;display:flex;align-items:center;justify-content:center;margin-left:8px;flex-shrink:0}
.winner-delete-btn:hover{opacity:.8}
.winner-phone{font-size:.8em;color:rgba(255,255,255,.6);margin-top:2px}
.winner-ticket{font-size:.75em;color:rgba(253,203,110,.7);margin-top:1px;font-family:monospace}

/* 抽奖准备阶段 */
#drawReady{display:none;text-align:center}
#drawReady.show{display:block}
.draw-ready-prize{display:inline-block;padding:30px 50px;border-radius:24px;background:linear-gradient(135deg,rgba(108,92,231,.15),rgba(253,203,110,.15));border:3px solid var(--gold);margin:20px}
.draw-ready-img{width:120px;height:120px;border-radius:16px;object-fit:cover;margin:0 auto 16px;display:block}
.draw-ready-name{font-size:2.5em;font-weight:bold;color:var(--gold);margin-bottom:12px}
.draw-ready-info{font-size:1.2em;color:#fff;margin-bottom:16px}
.draw-ready-count{font-size:2em;font-weight:bold;color:#a29bfe}
.draw-ready-hint{font-size:.85em;color:rgba(255,255,255,.6);margin-top:16px}

/* 中奖人删除按钮 */
.winner-delete-btn{background:var(--red);color:#fff;border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:1em;display:flex;align-items:center;justify-content:center;margin-left:8px;flex-shrink:0}
.winner-delete-btn:hover{opacity:.8}
.winner-phone{font-size:.8em;color:rgba(255,255,255,.6);margin-top:2px}
.winner-ticket{font-size:.75em;color:rgba(253,203,110,.7);margin-top:1px;font-family:monospace}

/* AI 结论展示层 */
#aiAnalysisLayer{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:250;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.88);border:2px solid var(--gold);border-radius:24px;padding:30px 50px;max-width:85vw;max-height:85vh;overflow-y:auto;box-shadow:0 0 60px rgba(253,203,110,.25)}
#aiAnalysisLayer.show{display:flex;animation:aiZoomIn .5s ease}
#aiAnalysisLayer .ai-badge{font-size:1em;color:var(--gold);margin-bottom:12px;letter-spacing:2px}
#aiAnalysisLayer .ai-text{font-size:1.6em;font-weight:bold;line-height:1.5;color:#fff;margin-bottom:20px}
#aiAnalysisLayer .ai-list-title{font-size:1em;color:var(--gold);margin-bottom:14px;letter-spacing:1px}
#aiAnalysisLayer .ai-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1200px}
#aiAnalysisLayer .ai-name-card{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:14px;background:rgba(108,92,231,.18);border:1px solid rgba(253,203,110,.35);font-size:1.1em;font-weight:bold;color:#fff;min-width:140px}
#aiAnalysisLayer .ai-name-card .ai-phone{font-size:.75em;color:rgba(255,255,255,.6);font-weight:normal}
@keyframes aiZoomIn{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}50%{transform:translate(-50%,-50%) scale(1.05)}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* 游戏覆盖层 */
#gameOverlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:150;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9)}
#gameOverlay.show{display:flex}
.game-header{position:absolute;top:30px;left:50%;transform:translateX(-50%);text-align:center;z-index:10}
.game-title{font-size:2.5em;font-weight:bold;margin-bottom:10px}
.game-desc{color:var(--gold);font-size:1.1em}
.game-close{position:absolute;top:20px;right:20px;padding:10px 24px;border-radius:20px;background:var(--red);color:#fff;cursor:pointer;font-size:1em;z-index:20}
#gameCanvas{position:absolute;top:0;left:0;width:100%;height:100%}

/* 游戏结果 */
.game-result{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:30;display:none}
.game-result.show{display:block}
.game-result h2{font-size:3em;margin-bottom:20px}
.game-result .rank{font-size:1.3em;margin:8px 0;padding:8px 24px;border-radius:12px}

/* 撒花 */
.confetti{position:fixed;width:10px;height:10px;top:-10px;z-index:9999;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{top:110vh;transform:rotate(720deg)}}

/* 流动元素样式 */
.flow-item{position:absolute;display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:20px;background:rgba(255,255,255,.1);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.15);white-space:nowrap;will-change:transform}
.flow-avatar{width:32px;height:32px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden;flex-shrink:0}
.flow-avatar img{width:100%;height:100%;object-fit:cover}
.flow-name{font-size:.95em}

/* MQTT 状态 */
#mqttStatus{position:fixed;top:12px;right:12px;z-index:100;display:flex;align-items:center;gap:6px;font-size:.8em;padding:5px 14px;border-radius:20px;background:rgba(0,0,0,.4)}
.mqtt-dot{width:8px;height:8px;border-radius:50%;background:#555;transition:.3s}
.mqtt-dot.online{background:var(--grn);box-shadow:0 0 8px var(--grn)}
.mqtt-dot.offline{background:var(--red)}
.mqtt-dot.connecting{background:var(--gold);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* 编辑面板 */
#editPanel{position:fixed;right:-300px;top:0;width:280px;height:100%;background:rgba(22,27,60,.95);z-index:300;transition:right .3s;padding:20px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.1)}
#editPanel.show{right:0}
.edit-title{font-size:1.1em;font-weight:bold;margin-bottom:16px;color:var(--gold)}
.edit-group{margin-bottom:16px}
.edit-group label{display:block;font-size:.82em;color:#a0a8c8;margin-bottom:4px}
.edit-group input,.edit-group select,.edit-group textarea{width:100%;padding:8px 10px;border-radius:8px;background:rgba(30,37,80,.8);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:.9em}
.edit-group input[type="range"]{padding:0}

/* 头像缓存 */
.avatar-cache{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="bgLayer"></div>
  <div id="titleBar">
    <div id="mainTitle">🎉 幸运抽奖盛典</div>
    <div id="signedCounter">已签到 <b style="color:var(--gold)" id="signedNum">0</b> 人</div>
  </div>
  <div id="flowContainer"><canvas id="flowCanvas"></canvas></div>
  <div id="customElements"></div>
  <div id="danmakuLayer"></div>
  <div id="avatarCache" class="avatar-cache"></div>

  <div id="mqttStatus"><div class="mqtt-dot connecting" id="mDot"></div><span id="mText">连接中...</span></div>

  <!-- 控制栏 -->
  <div id="ctrlBar">
    <button class="ctrl-btn btn-flow" onclick="toggleFlow()">✨ 切换动画</button>
    <button class="ctrl-btn btn-game" onclick="openGameMenu()">🎮 互动游戏</button>
    <button class="ctrl-btn btn-draw" id="drawBtn" onclick="startDraw()">🎲 开始抽奖</button>
  </div>
  <div style="position:fixed;bottom:6px;left:50%;transform:translateX(-50%);font-size:.7em;color:rgba(255,255,255,.25);pointer-events:none;white-space:nowrap;z-index:5000">本系统由TeleAgent自动设计生成</div>

  <!-- 抽奖覆盖层 -->
  <div id="drawOverlay">
    <div class="draw-pool">
      <div id="drawReady"></div>
      <div id="drawRolling" class="draw-names"></div>
      <div id="drawResult" class="draw-result"></div>
    </div>
  </div>

  <!-- AI 结论展示层 -->
  <div id="aiAnalysisLayer">
    <div>
      <div class="ai-badge">🤖 AI 分析结论</div>
      <div class="ai-text" id="aiAnalysisText"></div>
      <div class="ai-list-title" id="aiListTitle" style="display:none">🎯 命中名单</div>
      <div class="ai-grid" id="aiAnalysisList"></div>
    </div>
  </div>

  <!-- 背景音乐 -->
  <audio id="bgMusic" loop></audio>

  <!-- 游戏覆盖层 -->
  <div id="gameOverlay">
    <div class="game-header">
      <div class="game-title" id="gameTitle"></div>
      <div class="game-desc" id="gameDesc"></div>
    </div>
    <button class="game-close" onclick="closeGame()">✕ 退出游戏</button>
    <canvas id="gameCanvas"></canvas>
    <div class="game-result" id="gameResult"></div>
  </div>
</div>

<!-- 编辑面板 -->
<div id="editPanel">
  <div class="edit-title" id="epTitle">元素编辑</div>
  <div class="edit-group" id="epTextGrp"><label>文字内容</label><input id="epText" oninput="updateSelectedEl()"></div>
  <div class="edit-group" id="epSizeGrp"><label>字体大小</label><input id="epSize" type="range" min="12" max="120" oninput="updateSelectedEl()"></div>
  <div class="edit-group" id="epColorGrp"><label>颜色</label><input id="epColor" type="color" oninput="updateSelectedEl()"></div>
  <div class="edit-group" id="epWidthGrp"><label>宽度</label><input id="epWidth" type="number" oninput="updateSelectedEl()"></div>
  <div class="edit-group" id="epHeightGrp"><label>高度</label><input id="epHeight" type="number" oninput="updateSelectedEl()"></div>
  <div class="edit-group" id="epBoldGrp"><label>粗体</label><input id="epBold" type="checkbox" oninput="updateSelectedEl()"></div>
  <div class="edit-group" id="epImgInfo" style="display:none"><p style="font-size:.82em;color:var(--sub)">🖼️ 图片内容请在后台管理端上传设置。</p></div>
  <button class="ctrl-btn btn-flow" style="width:100%;justify-content:center;margin-top:10px" onclick="deleteSelectedEl()">🗑 删除元素</button>
  <button class="ctrl-btn btn-flow" style="width:100%;justify-content:center;margin-top:6px" onclick="closeEditPanel()">完成编辑</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let S={mqtt:null,topic:'',room:'',prizes:[],fields:[],participants:[],screen:{title:'',titleSize:48,titleColor:'#fdcb6e',bgUrl:'',flowType:'meteor',elements:[]},signin:{},drawCount:1,noRepeat:true,flowType:'meteor',isDrawing:false,flowItems:[],gameRunning:false,
  flowInterval:0,autoRotateTimer:null,
  danmakuSettings:{enable:true,speed:8,fontSize:28,max:50,badWords:[]},
  music:{enable:false,preset:'',url:'',name:'',volume:0.5},
  avatarImages:{},
  drawReadyIndex:0,drawReadyCount:1,
  lotteryRule:{enable:false,hitList:[]},
  quizResults:[]
};
let canvas,ctx,gameCanvas,gameCtx,animId;
let selectedEl=null;
let flowParticles=[],flowStars=[],heartPhase=0,globeRot=0,cloudT=0;

function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}

// ========== 初始化 ==========
const SB_URL='https://ohkcvvqumwliuwpsucui.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oa2N2dnF1bXdsaXV3cHN1Y3VpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzOTM2MTAsImV4cCI6MjEwMzk2OTYxMH0.azDTOFRgfS-dJp8Pw-4fZsVQYfidx5f2x7xqHkwgNVE';
let _sb=null,_cloudFlag=false;
(function init(){
  const p=new URLSearchParams(location.search);S.room=p.get('room')||'demo';S.topic='cj2026/'+S.room+'/';
  canvas=document.getElementById('flowCanvas');ctx=canvas.getContext('2d');
  gameCanvas=document.getElementById('gameCanvas');gameCtx=gameCanvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  connectMQTT();
  initCloud();
  applyScreenConfig();startFlow();
  applyMusic();
})();

// ========== 云端直连（Supabase，大屏数据源） ==========
function initCloud(){
  try{
    if(typeof supabase==='undefined'){console.warn('supabase-js 未加载');return}
    _sb=supabase.createClient(SB_URL,SB_KEY);
    cloudPull();
    // 订阅配置
    _sb.channel('scr-cfg-'+S.room)
      .on('postgres_changes',{event:'*',schema:'public',table:'room_data',filter:'room=eq.'+S.room},function(payload){
        if(_cloudFlag)return;
        if(payload.new&&payload.new.data)applyCloudConfig(payload.new.data);
      })
      .subscribe();
    // 订阅 participants
    _sb.channel('scr-pt-'+S.room)
      .on('postgres_changes',{event:'*',schema:'public',table:'participants',filter:'room=eq.'+S.room},function(p){
        if(_cloudFlag)return;
        cloudPullT();
      })
      .subscribe();
    // 订阅答题结果
    _sb.channel('scr-qr-'+S.room)
      .on('postgres_changes',{event:'*',schema:'public',table:'quiz_results',filter:'room=eq.'+S.room},function(){
        if(_cloudFlag)return;
        cloudPullT();
      })
      .subscribe();
  }catch(e){console.warn('大屏云端初始化失败',e)}
}
function cloudPullT(){
  if(!_sb)return;
  _sb.from('room_data').select('data').eq('room',S.room).maybeSingle().then(function(res){
    if(res.error){console.warn('云端配置拉取失败',res.error.message);return}
    if(res.data&&res.data.data){_cloudFlag=true;applyCloudConfig(res.data.data);setTimeout(function(){_cloudFlag=false},500)}
  });
  _sb.from('participants').select('*').eq('room',S.room).then(function(pr){
    if(pr.error){console.warn('云端参与者拉取失败',pr.error.message);return}
    if(pr.data){_cloudFlag=true;S.participants=pr.data.map(function(r){var d=r.data||{};if(!d.id)d.id=r.pid;return d});setTimeout(function(){_cloudFlag=false},500)}
    updateFlowItems();
  });
  _sb.from('quiz_results').select('*').eq('room',S.room).then(function(qr){
    if(qr.error){console.warn('云端答题拉取失败',qr.error.message);return}
    if(qr.data){_cloudFlag=true;S.quizResults=qr.data.map(function(r){return r.data||{}});setTimeout(function(){_cloudFlag=false},500)}
  });
}
function applyCloudConfig(d){
  if(!d||typeof d!=='object')return;
  S.prizes=d.prizes||S.prizes;S.fields=d.fields||S.fields;S.screen=Object.assign(S.screen,d.screen||{});S.signin=d.signin||S.signin;S.drawCount=d.drawCount||1;S.noRepeat=d.noRepeat!==false;
  S.flowInterval=d.flowInterval||0;
  S.danmakuSettings=Object.assign({enable:true,speed:8,fontSize:28,badWords:[]},d.danmaku||{});
  if(d.music)S.music=d.music;
  if(d.lotteryRule)S.lotteryRule=d.lotteryRule;
  applyScreenConfig();updateFlowItems();setupAutoRotate();applyMusic();
}

function resizeCanvas(){if(canvas){canvas.width=window.innerWidth;canvas.height=window.innerHeight}if(gameCanvas){gameCanvas.width=window.innerWidth;gameCanvas.height=window.innerHeight}}

// ========== MQTT ==========
function connectMQTT(){
  const cid='screen_'+uid();
  try{
    S.mqtt=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:cid,keepalive:30,clean:true,reconnectPeriod:3000,connectTimeout:10000});
    S.mqtt.on('connect',()=>{
      updateMqtt('online');
      S.mqtt.subscribe(S.topic+'config');
      S.mqtt.subscribe(S.topic+'lottery_result');
      S.mqtt.subscribe(S.topic+'draw_cmd');
      S.mqtt.subscribe(S.topic+'game_cmd');
      S.mqtt.subscribe(S.topic+'sign_in');
      S.mqtt.subscribe(S.topic+'register');
      S.mqtt.subscribe(S.topic+'shake_data');
      S.mqtt.subscribe(S.topic+'reaction_click');
      S.mqtt.subscribe(S.topic+'quiz_answer');
      S.mqtt.subscribe(S.topic+'danmaku_show');
      S.mqtt.subscribe(S.topic+'avatar_update');
      S.mqtt.subscribe(S.topic+'ai_analysis');
      S.mqtt.publish(S.topic+'request_config',JSON.stringify({type:'request',from:'screen',time:Date.now()}));
    });
    S.mqtt.on('message',(t,m)=>{try{const d=JSON.parse(m.toString());handleMsg(t,d)}catch(e){}});
    S.mqtt.on('error',()=>updateMqtt('offline'));S.mqtt.on('reconnect',()=>updateMqtt('connecting'));S.mqtt.on('close',()=>updateMqtt('offline'));
  }catch(e){updateMqtt('offline')}
}
function updateMqtt(s){const d=document.getElementById('mDot'),t=document.getElementById('mText');d.className='mqtt-dot '+s;t.textContent=s==='online'?'已连接':s==='offline'?'未连接':'连接中...'}
function handleMsg(t,d){
  if(t.endsWith('config')){
    // MQTT 配置为辅助（云端为权威来源），避免覆盖云端配置
    if(d.screen)S.screen=Object.assign(S.screen,d.screen);
    if(d.prizes)S.prizes=d.prizes;
    if(d.music)S.music=d.music;
    applyScreenConfig();updateFlowItems();setupAutoRotate();applyMusic();
  }else if(t.endsWith('draw_cmd')){
    if(d.action==='start')startDraw();else if(d.action==='game')openGame(d.game);
  }else if(t.endsWith('lottery_result')){
    showDrawResult(d.winners||[],d.time);
  }else if(t.endsWith('winner_void')){
    // 从后台同步删除中奖人
    var p=S.participants.find(pp=>pp.name===d.name);
    if(p){p.won=false;p.voided=true;p.prizeId=null}
    // 减少奖品计数
    var pr=S.prizes.find(pp=>pp.name===d.prize);
    if(pr&&pr.won>0)pr.won--;
    updateFlowItems();
  }else if(t.endsWith('shake_data')){
    shakePlayers[d.name]=(shakePlayers[d.name]||0)+(d.count||1);
  }else if(t.endsWith('reaction_click')&&reactionState==='go'){
    reactionPlayers[d.name]=(reactionPlayers[d.name]||0)+1;
  }else if(t.endsWith('quiz_answer')){
    if(!quizState.answers[d.name]){quizState.answers[d.name]=d.answer;quizState.roundTimes[d.name]=Date.now()-quizState.roundStart;}

  }else if(t.endsWith('register')||t.endsWith('sign_in')){
    const data=d.data||d;
    if(data.name){
      const exist=S.participants.find(p=>p.name===data.name);
      if(exist){Object.assign(exist,data)}
      else{S.participants.push(Object.assign({id:uid(),signed:true,won:false,prizeId:null},data))}
      updateFlowItems();
    }
  }else if(t.endsWith('danmaku_show')){
    showDanmaku(d.text,d.name,d.avatar,d.color);
  }else if(t.endsWith('avatar_update')){
    if(d.name&&d.avatar){
      S.avatarImages[d.name]=d.avatar;
      // 更新参与者头像
      const p=S.participants.find(pp=>pp.name===d.name);
      if(p)p.avatar=d.avatar;
      updateFlowItems();
    }
  }else if(t.endsWith('ai_analysis')){
    showAiAnalysis(d.text||'',d.list);
  }
}

// ========== 弹幕循环滚动 ==========
var dmQueue=[]; // 弹幕队列：按时间顺序保存
var dmActiveSlots=0; // 当前屏幕上活跃弹幕数
function showDanmaku(text,name,avatar,color){
  if(!S.danmakuSettings.enable)return;
  var badWords=S.danmakuSettings.badWords||[];
  for(var i=0;i<badWords.length;i++){if(text.includes(badWords[i]))return}
  // 加入弹幕队列（按时间顺序追加）
  dmQueue.push({text:text,name:name||'',avatar:avatar||'',time:Date.now()});
  // 队列长度不超过最大条数的3倍（避免无限增长）
  var maxQueue=(S.danmakuSettings.max||50)*3;
  while(dmQueue.length>maxQueue)dmQueue.shift();
  // 如果当前屏幕上弹幕数未达上限，立即展示
  var maxDM=S.danmakuSettings.max||50;
  if(dmActiveSlots<maxDM){renderNextDanmaku()}
}
function renderNextDanmaku(){
  if(!dmQueue.length)return;
  var maxDM=S.danmakuSettings.max||50;
  if(dmActiveSlots>=maxDM)return;
  var item=dmQueue.shift();
  var layer=document.getElementById('danmakuLayer');
  var div=document.createElement('div');
  div.className='dm-item';
  var fontSize=S.danmakuSettings.fontSize||28;
  var speed=S.danmakuSettings.speed||8;
  var colors=['#fff','#fdcb6e','#fd79a8','#a29bfe','#00b894','#0984e3','#e17055','#55efc4','#ff6b81','#74b9ff'];
  var c=colors[Math.floor(Math.random()*colors.length)];
  div.style.fontSize=fontSize+'px';
  div.style.color=c;
  div.style.top=(Math.random()*60+5)+'%';
  div.style.animationDuration=speed+'s';
  if(item.avatar){
    var av=document.createElement('span');
    av.className='dm-avatar';
    if(typeof item.avatar==='string'&&item.avatar.indexOf('emoji:')===0){
      av.classList.add('dm-avatar-emoji');
      av.textContent=item.avatar.substr(6);
    }else{
      av.innerHTML='<img src="'+item.avatar+'">';
    }
    div.appendChild(av);
  }
  if(item.name){
    var nick=document.createElement('span');
    nick.className='dm-nick';
    nick.textContent=item.name+':';
    div.appendChild(nick);
  }
  var tx=document.createElement('span');
  tx.textContent=item.text;
  div.appendChild(tx);
  dmActiveSlots++;
  layer.appendChild(div);
  // 弹幕动画结束后：从队列取下一条继续滚动（循环）
  setTimeout(function(){
    div.remove();
    dmActiveSlots--;
    // 立即补充下一条（如果队列里还有）
    if(dmQueue.length)renderNextDanmaku();
  },speed*1000+500);
}

function startDragEl(e,el,div){
  e.preventDefault();const sx=e.clientX-el.x,sy=e.clientY-el.y;
  document.querySelectorAll('.custom-el').forEach(d=>d.classList.remove('selected'));
  div.classList.add('selected');selectedEl=el;
  const handle=e.target.classList.contains('resize-handle');
  if(handle){startResize(e,el,div);return}
  const move=ev=>{el.x=ev.clientX-sx;el.y=ev.clientY-sy;div.style.left=el.x+'px';div.style.top=el.y+'px'};
  const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)};
  document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
}
function startResize(e,el,div){
  e.preventDefault();const sw=el.width||200,sh=el.height||150,sx=e.clientX,sy=e.clientY;
  const move=ev=>{el.width=Math.max(20,sw+ev.clientX-sx);el.height=Math.max(20,sh+ev.clientY-sy);div.style.width=el.width+'px';div.style.height=el.height+'px'};
  const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)};
  document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
}

// ========== 流动动画 ==========
function updateFlowItems(){
  const signed=S.participants.filter(p=>p.signed&&!p.won);
  document.getElementById('signedNum').textContent=signed.length;
  S.flowItems=signed.map(p=>{
    const nameField=S.fields.find(f=>f.showFlow)||S.fields[0];
    const avatarField=S.fields.find(f=>f.type==='avatar');
    let avatar=p.avatar||(p.fields&&avatarField?p.fields[avatarField.id]:'')||S.avatarImages[p.name]||'';
    return{name:p.name||'?',avatar:avatar,color:randomColor()};
  });
  if(S.flowItems.length===0&&signed.length===0){S.flowItems=[]}
}

const flowColors=['#6c5ce7','#fd79a8','#fdcb6e','#00b894','#0984e3','#e17055','#a29bfe','#fab1a0'];
function randomColor(){return flowColors[Math.floor(Math.random()*flowColors.length)]}

function toggleFlow(){
  const types=['meteor','heart','globe','wordcloud'];
  const idx=types.indexOf(S.flowType);S.flowType=types[(idx+1)%types.length];
  S.screen.flowType=S.flowType;stopFlow();startFlow();
  toast('切换至: '+{meteor:'流星特效',heart:'爱心组合',globe:'3D球形',wordcloud:'词云特效'}[S.flowType]);

// 变量已在顶部声明
function startFlow(){
  stopFlow();updateFlowItems();
  const type=S.flowType;
  if(type==='meteor')initMeteor();else if(type==='heart')initHeart();else if(type==='globe')initGlobe();else if(type==='wordcloud')initWordCloud();
  animate();
}
function stopFlow(){cancelAnimationFrame(animId);flowParticles=[];flowStars=[];ctx.clearRect(0,0,canvas.width,canvas.height)}

// --- 流星特效 ---
function initMeteor(){
  flowParticles=S.flowItems.map((item,i)=>{
    const angle=Math.PI+Math.random()*Math.PI;
    const speed=1+Math.random()*2;
    return{...item,x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,size:8+Math.random()*8,trail:[],maxTrail:15,rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*0.05};
  });
  flowStars=Array.from({length:60},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2,op:Math.random()*.5+.3}));
}
function drawMeteor(){
  ctx.fillStyle='rgba(10,14,39,.15)';ctx.fillRect(0,0,canvas.width,canvas.height);
  flowStars.forEach(s=>{ctx.fillStyle='rgba(255,255,255,'+s.op+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();s.x-=.3;if(s.x<0)s.x=canvas.width});
  flowParticles.forEach(p=>{
    p.trail.push({x:p.x,y:p.y});if(p.trail.length>p.maxTrail)p.trail.shift();
    p.trail.forEach((t,i)=>{const op=i/p.maxTrail;ctx.fillStyle=p.color.replace(')',','+op+')').replace('rgb','rgba');ctx.beginPath();ctx.arc(t.x,t.y,p.size*op,0,Math.PI*2);ctx.fill()});
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    drawAvatar(ctx,0,0,p.size*2,p);
    ctx.fillStyle='#fff';ctx.font='12px Microsoft YaHei';ctx.textAlign='center';ctx.fillText(p.name,0,p.size+14);
    ctx.restore();
    p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    if(p.x<-50)p.x=canvas.width+50;if(p.x>canvas.width+50)p.x=-50;
    if(p.y<-50)p.y=canvas.height+50;if(p.y>canvas.height+50)p.y=-50;
  });
}

// --- 爱心组合 ---
function initHeart(){
  heartPhase=0;
  flowParticles=S.flowItems.map((item,i)=>{
    const t=i/Math.max(S.flowItems.length,1);
    const a=t*Math.PI*2;
    return{...item,t:t,angle:a,scale:1,baseScale:0.8+Math.random()*0.4,offset:Math.random()*Math.PI*2};
  });
}
function heartPoint(t,scale,cx,cy){
  const x=16*Math.pow(Math.sin(t),3);
  const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
  return{x:cx+x*scale,y:cy+y*scale};
}
function drawHeart(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  heartPhase+=0.02;
  const cx=canvas.width/2,cy=canvas.height/2;
  const scale=Math.min(canvas.width,canvas.height)/50*(1+Math.sin(heartPhase)*0.1);
  ctx.strokeStyle='rgba(253,121,168,'+(0.3+Math.sin(heartPhase)*0.1)+')';ctx.lineWidth=2;
  ctx.beginPath();
  for(let t=0;t<=Math.PI*2+0.1;t+=0.05){const p=heartPoint(t,scale*1.1,cx,cy);if(t===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}
  ctx.stroke();
  flowParticles.forEach((p,i)=>{
    const t=p.t+heartPhase*0.3;
    const pos=heartPoint(t,scale*p.baseScale,cx,cy);
    const pulse=1+Math.sin(heartPhase*2+p.offset)*0.15;
    ctx.save();ctx.translate(pos.x,pos.y);
    drawAvatar(ctx,0,0,p.size*2*pulse,p);
    ctx.fillStyle='#fff';ctx.font='10px Microsoft YaHei';ctx.textAlign='center';ctx.fillText(p.name,0,p.size*pulse+12);
    ctx.restore();
  });
}

// --- 3D 球形 ---
function initGlobe(){
  globeRot=0;
  flowParticles=S.flowItems.map((item,i)=>{
    const phi=Math.acos(-1+(2*i)/Math.max(S.flowItems.length,1));
    const theta=Math.sqrt(S.flowItems.length*Math.PI)*phi;
    return{...item,phi,theta,x:0,y:0,z:0,size:10+Math.random()*4};
  });
}
function drawGlobe(){
  ctx.fillStyle='rgba(10,14,39,.1)';ctx.fillRect(0,0,canvas.width,canvas.height);
  globeRot+=0.008;
  const cx=canvas.width/2,cy=canvas.height/2,R=Math.min(canvas.width,canvas.height)*0.32;
  ctx.strokeStyle='rgba(108,92,231,.15)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
  flowParticles.forEach(p=>{
    p.x=R*Math.cos(p.theta+globeRot)*Math.sin(p.phi);
    p.y=R*Math.sin(p.theta+globeRot)*Math.sin(p.phi);
    p.z=R*Math.cos(p.phi);
    const scale=(p.z+R)/(2*R);
    const px=cx+p.x,py=cy+p.y;
    const size=p.size*(0.3+scale*0.7);
    const alpha=0.2+scale*0.8;
    ctx.save();ctx.globalAlpha=alpha;ctx.translate(px,py);
    drawAvatar(ctx,0,0,size*2,p);
    ctx.globalAlpha=alpha;ctx.fillStyle='#fff';ctx.font=(8+scale*6)+'px Microsoft YaHei';ctx.textAlign='center';ctx.fillText(p.name,0,size+10);
    ctx.restore();
  });
}

// --- 词云特效 ---
function initWordCloud(){
  cloudT=0;flowParticles=S.flowItems.map((item,i)=>{
    const angle=Math.random()*Math.PI*2;const r=Math.random()*Math.min(canvas.width,canvas.height)*0.35;
    return{...item,x:canvas.width/2+Math.cos(angle)*r,y:canvas.height/2+Math.sin(angle)*r,angle,r,speed:0.005+Math.random()*0.01,size:14+Math.random()*16,phase:Math.random()*Math.PI*2};
  });
}
function drawWordCloud(){
  ctx.fillStyle='rgba(10,14,39,.12)';ctx.fillRect(0,0,canvas.width,canvas.height);
  cloudT+=0.01;
  flowParticles.forEach(p=>{
    p.angle+=p.speed;const pulse=1+Math.sin(cloudT*2+p.phase)*0.2;
    const r=p.r*(1+Math.sin(cloudT+p.phase)*0.05);
    p.x=canvas.width/2+Math.cos(p.angle)*r;p.y=canvas.height/2+Math.sin(p.angle)*r*0.7;
    ctx.save();ctx.translate(p.x,p.y);
    const grad=ctx.createRadialGradient(0,0,0,0,0,p.size*1.5*pulse);
    grad.addColorStop(0,p.color);grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad;ctx.globalAlpha=0.3;ctx.beginPath();ctx.arc(0,0,p.size*1.5*pulse,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    drawAvatar(ctx,0,0,p.size*pulse,p);
    ctx.fillStyle=p.color;ctx.font='bold '+(p.size*pulse)+'px Microsoft YaHei';ctx.textAlign='center';
    ctx.fillText(p.name,0,p.size*pulse+12);
    ctx.restore();
  });
}

// 绘制头像（有图片用图片，没有用首字母）
const _avatarImgCache={};
function drawAvatar(ctx,x,y,size,p){
  size=Math.max(8,size);
  ctx.beginPath();ctx.arc(x,y,size/2,0,Math.PI*2);
  ctx.fillStyle=p.color||'#6c5ce7';ctx.fill();
  if(p.avatar){
    const key=p.avatar;
    if(_avatarImgCache[key]&&_avatarImgCache[key].complete&&_avatarImgCache[key].naturalWidth>0){
      ctx.save();ctx.beginPath();ctx.arc(x,y,size/2,0,Math.PI*2);ctx.clip();
      ctx.drawImage(_avatarImgCache[key],x-size/2,y-size/2,size,size);
      ctx.restore();
    }else{
      if(!_avatarImgCache[key]){
        const img=new Image();
        img.crossOrigin='anonymous';
        img.onload=function(){_avatarImgCache[key]=img};
        img.src=key;
      }
      // 没有图片就画首字母
      ctx.fillStyle='#fff';ctx.font='bold '+(size*0.4)+'px Microsoft YaHei';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.name?p.name[0]:'?',x,y);ctx.textBaseline='alphabetic';
    }
  }else{
    ctx.fillStyle='#fff';ctx.font='bold '+(size*0.4)+'px Microsoft YaHei';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.name?p.name[0]:'?',x,y);ctx.textBaseline='alphabetic';
  }
}

// ========== 抽奖 ==========
// 获取抽奖候选池：若启用抽奖规则，则仅从命中清单中选取；否则使用全部已完成知识问答的人员
function getDrawPool(){
  var lr=S.lotteryRule||{enable:false,hitList:[]};
  // 基础池：已完成知识问答的人员（quizResults），fallback 到已签到人员
  var basePool;
  if(S.quizResults&&S.quizResults.length){
    basePool=S.quizResults.map(function(qr){
      var p=S.participants.find(function(x){return (x.name||'')===(qr.name||'')});
      if(p)return p;
      return Object.assign({id:uid(),signed:true,won:false,prizeId:null,name:qr.name,phone:qr.phone||''},{});
    });
  }else{
    basePool=S.participants.filter(p=>p.signed);
  }
  if(lr.enable&&lr.hitList&&lr.hitList.length){
    // 命中清单为对象数组 {name,phone}
    var pool=lr.hitList.map(function(h){
      var p=basePool.find(function(x){return (x.name||'')===(h.name||'')});
      if(p)return p;
      return Object.assign({id:uid(),signed:true,won:false,prizeId:null,name:h.name,phone:h.phone||''},{});
    }).filter(function(p){return p.name&&!(S.noRepeat&&p.won)&&!p.voided});
    return pool;
  }
  return basePool.filter(p=>!(S.noRepeat&&p.won)&&!p.voided);
}
function startDraw(){
  if(S.isDrawing)return;
  const signed=getDrawPool();
  const available=S.prizes.filter(p=>p.won<p.count);
  if(!signed.length){toast((S.lotteryRule&&S.lotteryRule.enable)?'命中清单为空，请先执行规则匹配':'没有可参与的已完成答题人员');return}
  if(!available.length){toast('没有可抽的奖品');return}
  S.isDrawing=true;document.getElementById('drawBtn').disabled=true;
  S.drawReadyIndex=0;
  S.drawReadyCount=S.drawCount;
  showDrawReady();
}

function showDrawReady(){
  const overlay=document.getElementById('drawOverlay');overlay.classList.add('show');
  document.getElementById('drawRolling').style.display='none';
  document.getElementById('drawResult').classList.remove('show');
  const ready=document.getElementById('drawReady');
  ready.classList.add('show');
  const available=S.prizes.filter(p=>p.won<p.count);
  if(!available.length){toast('没有可抽的奖品');closeDrawOverlay();return}
  const prize=available[Math.min(S.drawReadyIndex,available.length-1)];
  ready.innerHTML='<div class="draw-ready-prize">'+
    (prize.img?'<img class="draw-ready-img" src="'+prize.img+'">':'')+
    '<div class="draw-ready-name" style="color:'+prize.color+'">'+prize.name+'</div>'+
    '<div class="draw-ready-info">剩余数量: '+(prize.count-prize.won)+' / '+prize.count+'</div>'+
    '<div class="draw-ready-count">每轮抽 '+S.drawReadyCount+' 人</div>'+
    '<div class="draw-ready-hint">← → 切换奖品 · ↑ ↓ 调整人数 · Enter/Space 开始抽奖</div>'+
    '</div>';
  if(!S._drawKeyHandler){
    S._drawKeyHandler=function(e){
      if(!document.getElementById('drawOverlay').classList.contains('show'))return;
      if(document.getElementById('drawReady').classList.contains('show')){
        if(e.key==='ArrowLeft'){e.preventDefault();var av=S.prizes.filter(p=>p.won<p.count);S.drawReadyIndex=(S.drawReadyIndex-1+av.length)%av.length;showDrawReady()}
        else if(e.key==='ArrowRight'){e.preventDefault();var av=S.prizes.filter(p=>p.won<p.count);S.drawReadyIndex=(S.drawReadyIndex+1)%av.length;showDrawReady()}
        else if(e.key==='ArrowUp'){e.preventDefault();S.drawReadyCount=Math.min(50,S.drawReadyCount+1);showDrawReady()}
        else if(e.key==='ArrowDown'){e.preventDefault();S.drawReadyCount=Math.max(1,S.drawReadyCount-1);showDrawReady()}
        else if(e.key==='Enter'||e.key===' '){e.preventDefault();beginActualDraw()}
        else if(e.key==='Escape'){e.preventDefault();closeDrawOverlay()}
      }
    };
    document.addEventListener('keydown',S._drawKeyHandler);
  }
}

function beginActualDraw(){
  const ready=document.getElementById('drawReady');ready.classList.remove('show');
  const signed=getDrawPool();
  const available=S.prizes.filter(p=>p.won<p.count);
  if(!signed.length||!available.length){closeDrawOverlay();return}
  const count=Math.min(S.drawReadyCount,signed.length);
  document.getElementById('drawRolling').style.display='flex';
  document.getElementById('drawResult').classList.remove('show');
  const rolling=document.getElementById('drawRolling');
  rolling.innerHTML='';
  let rollItems=[];
  for(let i=0;i<count;i++){rollItems.push(document.createElement('div'));rollItems[i].className='draw-name-item';rolling.appendChild(rollItems[i])}
  let scrollCount=0;
  const interval=setInterval(()=>{
    for(let i=0;i<count;i++){const r=signed[Math.floor(Math.random()*signed.length)];rollItems[i].textContent=r.name||'?'}
    scrollCount++;
  },80);
  setTimeout(()=>{
    clearInterval(interval);
    const winners=[];
    const pool=[...signed];
    for(let i=0;i<count&&pool.length>0;i++){
      const idx=Math.floor(Math.random()*pool.length);
      const w=pool[idx];pool.splice(idx,1);
      const prizeIndex=Math.min(S.drawReadyIndex,available.length-1);
      const prize=available[prizeIndex];
      prize.won++;w.won=true;w.prizeId=prize.id;w.prizeName=prize.name;
      var pData=S.participants.find(pp=>pp.name===w.name);
      var phone=pData?pData.phone:'';
      winners.push({name:w.name,phone:phone||'',prize:prize.name,prizeColor:prize.color,prizeImg:prize.img||'',avatar:w.avatar||S.avatarImages[w.name]||''});
    }
    broadcastLottery(winners);
    showDrawResult(winners,Date.now());
    document.getElementById('drawBtn').disabled=false;S.isDrawing=false;
    launchConfetti();
  },2500);
}

function closeDrawOverlay(){
  document.getElementById('drawOverlay').classList.remove('show');
  document.getElementById('drawReady').classList.remove('show');
  document.getElementById('drawRolling').style.display='none';
  document.getElementById('drawResult').classList.remove('show');
  document.getElementById('drawBtn').disabled=false;S.isDrawing=false;
}

function weightedPrize(prizes){const tw=prizes.reduce((s,p)=>s+p.weight,0);let r=Math.random()*tw;for(const p of prizes){r-=p.weight;if(r<=0)return p}return prizes[prizes.length-1]}
function showDrawResult(winners,drawTime){
  document.getElementById('drawRolling').style.display='none';
  document.getElementById('drawReady').classList.remove('show');
  const r=document.getElementById('drawResult');
  var prizeName=winners.length?winners[0].prize:'';
  var prizeImg=winners.length&&winners[0].prizeImg?winners[0].prizeImg:'';
  r.innerHTML='<div class="winner-card">'+
    (prizeImg?'<img src="'+prizeImg+'" style="width:80px;height:80px;border-radius:16px;object-fit:cover;margin:0 auto 12px;display:block">':'')+
    winners.map(function(w){
      var phoneDisplay=w.phone?w.phone.substring(0,3)+'****'+w.phone.substring(w.phone.length-4):'';
      return '<div class="winner-item"><div class="winner-avatar">'+(w.avatar?'<img src="'+w.avatar+'" style="width:100%;height:100%;object-fit:cover">':(w.name||'?')[0])+'</div><div><div class="winner-name">'+w.name+'</div>'+(phoneDisplay?'<div class="winner-phone">'+phoneDisplay+'</div>':'')+'</div><button class="winner-delete-btn" onclick="deleteWinner(\''+w.name+'\',\''+w.prize+'\','+(drawTime||0)+')" title="删除此中奖人">✕</button></div>';
    }).join('')+
    '<div class="winner-prize">🎉 获得：'+prizeName+'</div></div>';
  r.classList.add('show');
  setTimeout(function(){document.getElementById('drawOverlay').classList.remove('show')},8000);
}
function deleteWinner(name,prize,drawTime){
  if(!confirm('确认删除中奖人「'+name+'」？\n将取消其中奖资格，且不再返回抽奖池。'))return;
  var p=S.participants.find(pp=>pp.name===name);
  if(p){p.won=false;p.voided=true;p.prizeId=null}
  var pr=S.prizes.find(pp=>pp.name===prize);
  if(pr&&pr.won>0)pr.won--;
  // 广播到后台
  if(S.mqtt&&S.mqtt.connected){S.mqtt.publish(S.topic+'winner_void',JSON.stringify({name:name,prize:prize,time:drawTime||Date.now()}))}
  // 更新大屏显示
  updateFlowItems();
  toast('已删除中奖人：'+name);
  // 重新渲染结果（移除被删除的人）
  var overlay=document.getElementById('drawOverlay');
  if(overlay.classList.contains('show')){
    var items=overlay.querySelectorAll('.winner-item');
    items.forEach(function(item){
      var nm=item.querySelector('.winner-name');
      if(nm&&nm.textContent===name)item.remove();
    });
  }
}
function broadcastLottery(winners){
  if(!S.mqtt||!S.mqtt.connected)return;
  S.mqtt.publish(S.topic+'lottery_result',JSON.stringify({winners:winners,time:Date.now()}));
}

function runQuizGame(){
  var rounds=(S.gameConfig&&S.gameConfig.quizRounds)||3;
  var interval=(S.gameConfig&&S.gameConfig.quizInterval)||5;
  quizState={currentRound:0,totalRounds:rounds,answers:{},current:null,scores:{},totalTime:{},roundStart:0,roundTimes:{}};
  gameCtx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
  if(S.mqtt){S.mqtt.subscribe(S.topic+'quiz_answer')}
  // 通知手机端开始抢答
  if(S.mqtt&&S.mqtt.connected){
    S.mqtt.publish(S.topic+'game_cmd',JSON.stringify({action:'start',game:'quiz',rounds:rounds,interval:interval,time:Date.now()}));
  }
  runQuizRound(0,rounds,interval);
}
function runQuizRound(roundIdx,totalRounds,interval){
  if(roundIdx>=totalRounds){endQuizGameFinal();return}
  quizState.currentRound=roundIdx+1;
  // 随机抽题
  var q=quizzes[Math.floor(Math.random()*quizzes.length)];
  quizState.current=q;quizState.answers={};quizState.roundStart=Date.now();
  // 绘制题目
  gameCtx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
  gameCtx.fillStyle='#fdcb6e';gameCtx.font='bold 36px Microsoft YaHei';gameCtx.textAlign='center';
  gameCtx.fillText('🧠 趣味抢答 第'+(roundIdx+1)+'/'+totalRounds+'轮',gameCanvas.width/2,60);
  gameCtx.fillStyle='#fff';gameCtx.font='bold 40px Microsoft YaHei';
  gameCtx.fillText(q.q,gameCanvas.width/2,160);
  q.options.forEach((opt,i)=>{gameCtx.fillStyle=i===0?'#6c5ce7':i===1?'#fd79a8':i===2?'#00b894':'#0984e3';gameCtx.fillRect(gameCanvas.width/2-300,240+i*80,600,65);gameCtx.fillStyle='#fff';gameCtx.font='bold 28px Microsoft YaHei';gameCtx.fillText((['A','B','C','D'])[i]+'. '+opt,gameCanvas.width/2,280+i*80)});
  document.getElementById('gameDesc').textContent='第'+(roundIdx+1)+'轮答题中...';
  // 通知手机端题目
  if(S.mqtt&&S.mqtt.connected){
    S.mqtt.publish(S.topic+'game_cmd',JSON.stringify({action:'start',game:'quiz',round:roundIdx+1,totalRounds:totalRounds,question:q.q,options:q.options,answer:q.a,roundStart:Date.now(),time:Date.now()}));
  }
  // 等待答题时间（使用轮间间隔作为每轮答题时间）
  var answerTime=interval*1000;
  setTimeout(function(){
    if(!S.gameRunning){return}
    // 记录本轮结果
    var roundEnd=Date.now();
    var correct=Object.entries(quizState.answers).filter(function(e){return e[1]===q.a});
    // 记录每人本轮用时
    Object.keys(quizState.answers).forEach(function(name){
      var answerTimeForUser=quizState.roundTimes[name]||(roundEnd-quizState.roundStart);
      if(!quizState.totalTime[name])quizState.totalTime[name]=0;
      if(quizState.answers[name]===q.a){
        // 答对：加实际用时
        quizState.totalTime[name]+=answerTimeForUser;
      }else{
        // 答错：加间隔的1.2倍
        quizState.totalTime[name]+=Math.round(interval*1.2*1000);
      }
    });
    // 未答的人也加惩罚
    // (未答的人不在 answers 中，不处理)
    // 显示本轮结果
    gameCtx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
    gameCtx.fillStyle='#00b894';gameCtx.font='bold 40px Microsoft YaHei';gameCtx.textAlign='center';
    gameCtx.fillText('第'+(roundIdx+1)+'轮结束',gameCanvas.width/2,80);
    gameCtx.fillStyle='#fff';gameCtx.font='bold 32px Microsoft YaHei';
    gameCtx.fillText('正确答案：'+q.a,gameCanvas.width/2,150);
    var yPos=220;
    correct.slice(0,5).forEach(function(e,i){
      gameCtx.fillStyle=i===0?'#fdcb6e':'#fff';gameCtx.font='bold 24px Microsoft YaHei';
      gameCtx.fillText((i+1)+'. '+e[0],gameCanvas.width/2,yPos);yPos+=40;
    });
    document.getElementById('gameDesc').textContent='正确答案：'+q.a+'  答对'+correct.length+'人';
    // 通知手机端本轮结束
    if(S.mqtt&&S.mqtt.connected){
      S.mqtt.publish(S.topic+'game_cmd',JSON.stringify({action:'round_end',game:'quiz',round:roundIdx+1,correct:q.a,correctNames:correct.map(function(e){return e[0]}),time:Date.now()}));
    }
    // 间隔后开始下一轮
    setTimeout(function(){
      if(S.gameRunning){runQuizRound(roundIdx+1,totalRounds,interval)}
    },3000);
  },answerTime);
}
function endQuizGameFinal(){
  // 按总时长升序排名
  var sorted=Object.entries(quizState.totalTime).sort(function(a,b){return a[1]-b[1]}).slice(0,10);
  document.getElementById('gameDesc').textContent='抢答全部结束！';
  var result=document.getElementById('gameResult');
  result.innerHTML='<h2>🧠 趣味抢答总排名</h2><div style="color:#aaa;font-size:.85em;margin-bottom:10px">按总答题时长排名（短者优先，答错/超时按轮间间隔1.2倍计）</div>'+sorted.slice(0,3).map(function(e,i){return '<div class="rank" style="background:'+['rgba(253,203,110,.2)','rgba(192,192,192,.2)','rgba(205,127,50,.2)'][i]+'">'+['🥇','🥈','🥉'][i]+' '+e[0]+' - '+(e[1]/1000).toFixed(1)+'秒</div>'}).join('')||'<div class="rank">无人参与</div>';
  result.classList.add('show');
  if(S.mqtt){S.mqtt.unsubscribe(S.topic+'quiz_answer');S.mqtt.publish(S.topic+'game_cmd',JSON.stringify({action:'end',game:'quiz',rankings:sorted.slice(0,3).map(function(e,i){return{name:e[0],score:e[1],rank:i+1}})}))}
}

function closeGame(){
  S.gameRunning=false;
  document.getElementById('gameOverlay').classList.remove('show');
  document.getElementById('gameResult').classList.remove('show');
  if(S.mqtt){S.mqtt.publish(S.topic+'game_cmd',JSON.stringify({action:'close'}))}
  gameCtx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
}
