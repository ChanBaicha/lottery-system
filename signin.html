<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>抽奖签到端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#0a0e27;color:#fff;min-height:100vh;user-select:none}
input,button,select,textarea{font-family:inherit;outline:none;border:none}
:root{--pri:#6c5ce7;--pri-l:#a29bfe;--acc:#fd79a8;--gold:#fdcb6e;--grn:#00b894;--red:#e17055;--card:#161b3c;--card2:#1e2550;--sub:#a0a8c8;--bd:rgba(255,255,255,.1)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--pri);border-radius:2px}
.btn{padding:10px 20px;border-radius:10px;cursor:pointer;font-size:.95em;transition:.2s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:active{background:#5a4bd1}
.btn-out{background:transparent;border:1px solid var(--bd);color:var(--sub)}.btn-out:active{border-color:var(--pri);color:#fff}
.btn-suc{background:var(--grn);color:#fff}.btn-dng{background:var(--red);color:#fff}
.btn-gold{background:var(--gold);color:#333;font-weight:bold}
.card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:14px;border:1px solid var(--bd)}
.f-grp{margin-bottom:12px}
.f-grp label{display:block;font-size:.85em;color:var(--sub);margin-bottom:4px}
.f-grp input,.f-grp select,.f-grp textarea{width:100%;padding:12px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--bd);color:#fff;font-size:1em}
.f-grp input:focus{border-color:var(--pri)}
.f-grp input::placeholder{color:#4a5070}
textarea{width:100%;padding:10px;border-radius:10px;background:var(--card2);border:1px solid var(--bd);color:#fff;font-size:.9em;resize:vertical}
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal-card{background:var(--card);border-radius:20px;padding:30px;width:100%;max-width:400px;text-align:center;border:1px solid var(--bd)}
.func-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.func-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 12px;border-radius:16px;cursor:pointer;transition:.2s;border:none;font-family:inherit}
.func-btn:active{transform:scale(.96)}
.func-icon{font-size:2.4em;line-height:1}
.func-label{font-size:1em;font-weight:bold}
.func-desc{font-size:.75em;opacity:.7}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 签到首页：4个功能按钮 ===== -->
  <div id="signPage" style="padding:16px;max-width:500px;margin:0 auto;min-height:100vh">
    <div style="text-align:center;padding:20px 0">
      <h1 style="font-size:1.6em;background:linear-gradient(135deg,#fd79a8,#fdcb6e);-webkit-background-clip:text;-webkit-text-fill-color:transparent">🎉 幸运抽奖签到</h1>
      <p style="color:var(--sub);font-size:.85em;margin-top:4px">选择功能参与抽奖</p>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:.75em;padding:4px 10px;border-radius:16px;background:rgba(255,255,255,.05);width:fit-content;margin:0 auto 20px"><div id="mDot" style="width:6px;height:6px;border-radius:50%;background:#555"></div><span id="mText">连接中</span></div>

    <!-- 头像预览（已设置时显示） -->
    <div id="homeAvatarBar" style="display:none;text-align:center;margin-bottom:16px">
      <img id="homeAvatarImg" style="width:50px;height:50px;border-radius:50%;border:2px solid var(--pri);object-fit:cover;vertical-align:middle">
      <span id="homeNickLabel" style="color:var(--gold);font-size:.9em;margin-left:8px"></span>
    </div>

    <!-- 4个功能按钮 -->
    <div class="func-grid">
      <button class="func-btn" style="background:var(--pri);color:#fff" onclick="showAvatarPage()">
        <span class="func-icon">📱</span>
        <span class="func-label">头像昵称</span>
        <span class="func-desc">设置头像与昵称</span>
      </button>
      <button class="func-btn" style="background:var(--gold);color:#333" onclick="showDanmakuPage()">
        <span class="func-icon">💬</span>
        <span class="func-label">弹幕互动</span>
        <span class="func-desc">发送弹幕上大屏</span>
      </button>
      <button class="func-btn" style="background:var(--grn);color:#fff" onclick="showSigninFormPage()">
        <span class="func-icon">📝</span>
        <span class="func-label">签到参与</span>
        <span class="func-desc">填写信息完成签到</span>
      </button>
      <button class="func-btn" style="background:var(--card);color:var(--pri-l);border:2px solid var(--pri)" onclick="showGameModal()">
        <span class="func-icon">🎮</span>
        <span class="func-label">互动游戏</span>
        <span class="func-desc">摇一摇/反应/抢答</span>
      </button>
    </div>
  </div>

  <!-- ===== 头像昵称页 ===== -->
  <div id="avatarPage" style="display:none;padding:16px;max-width:500px;margin:0 auto;min-height:100vh">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-weight:bold;font-size:1.1em">📱 头像与昵称</div>
      <button class="btn btn-out" style="padding:6px 12px;font-size:.8em" onclick="backToHome()">← 返回</button>
    </div>
    <div class="card" style="text-align:center">
      <div id="avatarPagePreview" style="width:100px;height:100px;border-radius:50%;background:var(--card2);border:3px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:3em;color:var(--sub);margin:0 auto 16px">👤</div>
      <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="processAvatarFile(this.files[0])">
      <button class="btn btn-pri" style="width:100%;padding:14px;margin-bottom:10px" onclick="document.getElementById('avatarFileInput').click()">📷 选择头像</button>
      <p style="color:var(--sub);font-size:.78em;margin-bottom:16px">可从相册选择或拍照</p>
      <div class="f-grp">
        <label>昵称（可自行修改）</label>
        <input id="wxNickname" type="text" placeholder="输入你的昵称" style="text-align:center">
      </div>
      <button class="btn btn-suc" style="width:100%;padding:14px" onclick="saveAvatarNick()">✓ 保存</button>
    </div>
  </div>

  <!-- ===== 弹幕页 ===== -->
  <div id="danmakuPage" style="display:none;padding:16px;max-width:500px;margin:0 auto;min-height:100vh">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-weight:bold;font-size:1.1em">💬 弹幕互动</div>
      <button class="btn btn-out" style="padding:6px 12px;font-size:.8em" onclick="backToHome()">← 返回</button>
    </div>
    <div class="card">
      <p style="color:var(--sub);font-size:.82em;margin-bottom:10px">发送弹幕消息，实时显示在大屏上</p>
      <div class="f-grp">
        <textarea id="dmPageInput" rows="3" placeholder="输入弹幕内容..." maxlength="50"></textarea>
      </div>
      <button class="btn btn-pri" style="width:100%;padding:14px" onclick="sendPageDanmaku()">发送弹幕</button>
    </div>
  </div>

  <!-- ===== 签到表单页 ===== -->
  <div id="signinFormPage" style="display:none;padding:16px;max-width:500px;margin:0 auto;min-height:100vh">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-weight:bold;font-size:1.1em">📝 签到参与</div>
      <button class="btn btn-out" style="padding:6px 12px;font-size:.8em" onclick="backToHome()">← 返回</button>
    </div>
    <div class="card">
      <div id="signForm"></div>
      <div class="f-grp" id="signRemarkGrp" style="display:none">
        <label>备注说明</label>
        <textarea id="signRemark" rows="2" placeholder="可填写备注信息（选填）"></textarea>
      </div>
      <button class="btn btn-pri" style="width:100%;padding:14px;font-size:1em" onclick="doSignin()">✅ 签 到</button>
    </div>
    <div class="card" id="signLocCard" style="display:none">
      <div style="font-weight:bold;margin-bottom:10px">📍 定位验证</div>
      <p style="font-size:.82em;color:var(--sub);margin-bottom:12px" id="signLocDesc">需要获取您的定位信息进行签到验证</p>
      <div id="signLocStatus" style="text-align:center;padding:12px;border-radius:10px;background:var(--card2);font-size:.88em;color:var(--sub);margin-bottom:12px">签到时自动获取定位</div>
    </div>
  </div>

  <!-- ===== 签到成功等待页 ===== -->
  <div id="signWaiting" style="display:none;padding:16px;max-width:500px;margin:0 auto;min-height:100vh">
    <div style="text-align:center;padding:40px 0">
      <div style="font-size:3em;margin-bottom:16px">✅</div>
      <div class="card">
        <div style="font-size:1.1em;font-weight:bold;color:var(--grn);margin-bottom:10px">签到成功！</div>
        <p style="color:var(--sub);font-size:.9em;line-height:2">当前已有 <b id="waitCount" style="color:var(--gold);font-size:1.3em">0</b> 人参与<br><b style="color:var(--gold)">已签到，请耐心等待</b><br>中奖结果将实时推送到此页面</p>
      </div>
      <div id="signPrizes" style="margin-top:16px"></div>
    </div>
    <!-- 4个功能按钮（签到后同样可用） -->
    <div class="func-grid">
      <button class="func-btn" style="background:var(--pri);color:#fff" onclick="showAvatarPage()">
        <span class="func-icon">📱</span><span class="func-label">头像昵称</span>
      </button>
      <button class="func-btn" style="background:var(--gold);color:#333" onclick="showDanmakuPage()">
        <span class="func-icon">💬</span><span class="func-label">发弹幕</span>
      </button>
      <button class="func-btn" style="background:var(--grn);color:#fff" onclick="backToHome()">
        <span class="func-icon">🏠</span><span class="func-label">返回首页</span>
      </button>
      <button class="func-btn" style="background:var(--card);color:var(--pri-l);border:2px solid var(--pri)" onclick="showGameModal()">
        <span class="func-icon">🎮</span><span class="func-label">互动游戏</span>
      </button>
    </div>
    <!-- 头像预览 -->
    <div id="avatarPreview" style="display:none;text-align:center;margin-top:12px">
      <img id="avatarImg" style="width:80px;height:80px;border-radius:50%;border:2px solid var(--pri);object-fit:cover">
      <p style="color:var(--grn);font-size:.82em;margin-top:4px">✓ 头像已设置</p>
    </div>
  </div>

  <!-- ===== 中奖结果页 ===== -->
  <div id="signWon" style="display:none;padding:16px;max-width:500px;margin:0 auto;min-height:100vh">
    <div style="text-align:center;padding:40px 0">
      <div style="font-size:3em;margin-bottom:16px" id="wonIcon">🎉</div>
      <div class="card" style="border:2px solid var(--gold)">
        <div style="font-size:1.2em;font-weight:bold;color:var(--gold);margin-bottom:10px" id="wonTitle">🎊 恭喜中奖！</div>
        <div id="wonName" style="font-size:1.5em;font-weight:bold;margin-bottom:8px"></div>
        <div id="wonPrize" style="color:var(--gold);font-size:1.3em"></div>
        <div id="wonTime" style="color:var(--sub);font-size:.82em;margin-top:8px"></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-gold" style="flex:1;padding:12px" onclick="showGameModal()">🎮 互动游戏</button>
        <button class="btn btn-out" style="flex:1;padding:12px" onclick="backToHome()">🏠 返回首页</button>
      </div>
    </div>
  </div>

  <!-- ===== 互动游戏页 ===== -->
  <div id="gamePage" style="display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center">
    <div style="position:absolute;top:16px;right:16px"><button class="btn btn-out" style="padding:6px 14px;font-size:.85em" onclick="exitGame()">← 返回</button></div>
    <h2 id="gameTitle" style="font-size:1.5em;margin-bottom:8px"></h2>
    <p id="gameDesc" style="color:var(--gold);font-size:1em;margin-bottom:24px"></p>
    <div id="gameContent" style="width:100%;max-width:400px"></div>
    <div id="gameResult" style="display:none;margin-top:24px"></div>
  </div>
</div>

  <!-- 背景音乐 -->
  <audio id="bgMusic" loop></audio>

  <!-- 签到失败弹窗 -->
<div class="modal-bg" id="failModal">
  <div class="modal-card">
    <div style="font-size:2.5em;margin-bottom:10px">❌</div>
    <div style="font-size:1.1em;font-weight:bold;color:var(--red);margin-bottom:10px">签到失败</div>
    <p id="failMsg" style="color:var(--sub);font-size:.95em;line-height:1.8;margin-bottom:20px"></p>
    <button class="btn btn-pri" style="width:100%;padding:12px" onclick="closeFailModal()">我知道了</button>
  </div>
</div>

<!-- 游戏选择弹窗 -->
<div class="modal-bg" id="gameModal" onclick="if(event.target===this)closeGameModal()">
  <div class="modal-card" style="max-width:350px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:1.2em;font-weight:bold">🎮 互动游戏</div>
      <button class="btn btn-out" style="padding:4px 10px;font-size:.8em" onclick="closeGameModal()">✕</button>
    </div>
    <div id="gameMenu"></div>
    <p style="color:var(--sub);font-size:.72em;margin-top:8px">点击空白区域可退出</p>
  </div>
</div>

<div id="toast" style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:30px;background:rgba(0,0,0,.85);z-index:9999;font-size:.9em;opacity:0;transition:.3s;pointer-events:none"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<script>
let S={mqtt:null,topic:'',room:'',
  fields:[],prizes:[],signin:{enable:true},drawCount:1,signFailMsg:'签到失败！请检查您填写的姓名、手机号和抽奖券编码是否正确。',
  voidedTickets:[],allParticipants:[],
  signedIn:false,myName:'',myData:{},avatarData:'',
  danmakuSettings:{enable:true,anonymous:true},
  music:{enable:false,preset:'',url:'',name:'',volume:0.5},
  gameType:null,shakeCount:0,shakeListening:false,reactionReady:false,reactionPenaltyUntil:0,quizAnswer:null,
  shakeBatchTimer:null,shakePending:0,
  _avatarTmp:''
};
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function toast(m,d=2000){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',d)}
function fmt(d){const dt=new Date(d);return(dt.getMonth()+1)+'/'+dt.getDate()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0')}

// ========== 初始化 ==========
(function init(){
  const p=new URLSearchParams(location.search);S.room=p.get('room')||'demo';S.topic='cj2026/'+S.room+'/';
  // 恢复已签到状态（刷新后不再显示签到按钮）
  try{
    const sd=JSON.parse(localStorage.getItem('cj_signed_'+S.room)||'null');
    if(sd&&sd.name){S.signedIn=true;S.myName=sd.name}
  }catch(e){}
  connectMQTT();
})();

// ========== MQTT ==========
function connectMQTT(){
  const cid='signin_'+uid();
  try{
    S.mqtt=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:cid,keepalive:30,clean:true,reconnectPeriod:3000,connectTimeout:10000});
    S.mqtt.on('connect',()=>{
      updateMqtt('online');
      S.mqtt.subscribe(S.topic+'config');
      S.mqtt.subscribe(S.topic+'lottery_result');
      S.mqtt.subscribe(S.topic+'game_cmd');
      S.mqtt.publish(S.topic+'request_config',JSON.stringify({type:'request',from:'signin',time:Date.now()}));
    });
    S.mqtt.on('message',(t,m)=>{try{const d=JSON.parse(m.toString());handleMsg(t,d)}catch(e){}});
    S.mqtt.on('error',()=>updateMqtt('offline'));S.mqtt.on('reconnect',()=>updateMqtt('connecting'));S.mqtt.on('close',()=>updateMqtt('offline'));
  }catch(e){updateMqtt('offline')}
}
function updateMqtt(s){const d=document.getElementById('mDot'),t=document.getElementById('mText');if(!d)return;d.style.background=s==='online'?'#00b894':s==='offline'?'#e17055':'#fdcb6e';t.textContent=s==='online'?'在线':s==='offline'?'离线':'连接中'}
function handleMsg(t,d){
  if(t.endsWith('config')){
    S.fields=d.fields||S.fields;S.prizes=d.prizes||[];S.signin=d.signin||S.signin;S.drawCount=d.drawCount||1;
    S.signFailMsg=d.signFailMsg||S.signFailMsg;
    S.voidedTickets=d.voidedTickets||[];S.allParticipants=d.participants||[];
    S.danmakuSettings=d.danmaku||{enable:true,anonymous:true};
    if(d.music)S.music=d.music;applyMusic();
    if(!S.signedIn)renderSignForm();
    if(S.signedIn){
      document.getElementById('waitCount').textContent=d.participantCount||0;renderSignPrizes();
      // 若已从localStorage恢复签到状态，直接显示等待页（隐藏首页签到按钮）
      var sp=document.getElementById('signPage'),sw=document.getElementById('signWaiting');
      if(sp&&sw&&sp.style.display!=='none'&&sw.style.display==='none'){
        hideAllPages();sw.style.display='block';
      }
    }
  }else if(t.endsWith('lottery_result')){
    handleLotteryResult(d.winners||[]);
  }else if(t.endsWith('game_cmd')){
    handleGameCmd(d);
  }
}

// ========== 页面导航 ==========
function hideAllPages(){
  ['signPage','avatarPage','danmakuPage','signinFormPage','signWaiting','signWon','gamePage'].forEach(function(id){var el=document.getElementById(id);if(el)el.style.display='none'});
}
function showAvatarPage(){hideAllPages();document.getElementById('avatarPage').style.display='block';updateAvatarPagePreview()}
function showDanmakuPage(){hideAllPages();document.getElementById('danmakuPage').style.display='block';document.getElementById('dmPageInput').focus()}
function showSigninFormPage(){hideAllPages();document.getElementById('signinFormPage').style.display='block';renderSignForm()}
function backToHome(){
  if(S.gameType){S.gameType=null;shakeListening=false}
  hideAllPages();
  if(S.signedIn){document.getElementById('signWaiting').style.display='block'}
  else{document.getElementById('signPage').style.display='block'}
  updateHomeAvatarBar();
}

// ========== 签到表单 ==========
function renderSignForm(){
  const form=document.getElementById('signForm');
  if(!S.fields.length){form.innerHTML='<p style="color:var(--sub);text-align:center;padding:16px">暂无签到字段</p>';return}
  form.innerHTML=S.fields.map(f=>{
    if(f.type==='select'){const opts=(f.options||'').split(',').filter(Boolean);return '<div class="f-grp"><label>'+f.name+(f.required?' *':'')+'</label><select id="sign_'+f.id+'" data-required="'+f.required+'" data-name="'+f.name+'"><option value="">请选择</option>'+opts.map(o=>'<option value="'+o.trim()+'">'+o.trim()+'</option>').join('')+'</select></div>'}
    if(f.type==='textarea')return '<div class="f-grp"><label>'+f.name+(f.required?' *':'')+'</label><textarea id="sign_'+f.id+'" data-required="'+f.required+'" data-name="'+f.name+'" placeholder="'+(f.placeholder||'')+'" rows="3"></textarea></div>';
    if(f.type==='phone')return '<div class="f-grp"><label>'+f.name+(f.required?' *':'')+'</label><div style="display:flex;align-items:center;gap:6px"><input id="sign_'+f.id+'_pre" data-required="'+f.required+'" data-name="'+f.name+'" data-field-type="phone" type="tel" placeholder="前3位" maxlength="3" style="width:80px;padding:12px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--bd);color:#fff;font-size:1em;text-align:center"><span style="color:var(--sub);font-weight:bold;font-size:1.1em">XXXX</span><input id="sign_'+f.id+'_suf" data-required="'+f.required+'" data-name="'+f.name+'" data-field-type="phone" type="tel" maxlength="4" style="width:90px;padding:12px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--bd);color:#fff;font-size:1em;text-align:center"><input id="sign_'+f.id+'" type="hidden" data-required="'+f.required+'" data-name="'+f.name+'" data-field-type="phone"></div></div>';
    if(f.type==='ticket')return '<div class="f-grp"><label>'+f.name+(f.required?' *':'')+' <span style="color:var(--gold);font-size:.75em">（5位数字）</span></label><input id="sign_'+f.id+'" data-required="'+f.required+'" data-name="'+f.name+'" data-field-type="ticket" type="text" maxlength="5" placeholder="'+(f.placeholder||'请输入5位数字编码')+'" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')" style="letter-spacing:2px;font-family:monospace"></div>';
    if(f.type==='avatar')return '';
    return '<div class="f-grp"><label>'+f.name+(f.required?' *':'')+'</label><input id="sign_'+f.id+'" data-required="'+f.required+'" data-name="'+f.name+'" type="'+(f.type==='number'?'number':'text')+'" placeholder="'+(f.placeholder||'')+'"></div>';
  }).join('');

    document.getElementById('signLocDesc').textContent='需要在指定位置('+S.signin.radius+'米内)和时间段内签到';
  }else{

// ========== 签到验证 ==========
function doSignin(){
  const data={};let valid=true;
  S.fields.forEach(f=>{
    if(f.type==='avatar')return;
    const el=document.getElementById('sign_'+f.id);
    if(!el)return;
    var val=el.value.trim();
    // 手机号分段输入特殊处理
    if(f.type==='phone'){
      var pre=document.getElementById('sign_'+f.id+'_pre');
      var suf=document.getElementById('sign_'+f.id+'_suf');
      var preVal=pre?pre.value.trim():'';
      var sufVal=suf?suf.value.trim():'';
      if(f.required&&(!preVal||!sufVal)){toast('请完整填写 '+f.name+'（前3位和后4位）');valid=false;return}
      val=preVal+'XXXX'+sufVal; // 拼接为完整格式（前3+XXXX+后4）
      el.value=val; // 同步hidden字段
    }
    if(f.type==='ticket'&&val&&!/^\d{5}$/.test(val)){toast(f.name+'必须为5位数字编码');valid=false;return}
    if(f.required&&!val){toast('请填写 '+f.name);valid=false;return}
    data[f.id]=val;data[f.name]=val;
    if(f.type==='text')data.name=val;
    if(f.type==='phone')data.phone=val;
    if(f.type==='ticket')data.ticket=val;
  });
  if(!valid)return;
  let sName='',sPhone='',sTicket='';
  S.fields.forEach(f=>{
    if(f.type==='text'&&!sName)sName=data[f.name]||'';
    if(f.type==='phone'&&!sPhone)sPhone=data[f.name]||'';
    if(f.type==='ticket'&&!sTicket)sTicket=data[f.name]||'';
  });
  if(S.allParticipants&&S.allParticipants.length){
    if(!sName||!sPhone||!sTicket){
      showFailModal('请完整填写姓名、手机号和抽奖券编码');
      return;
    }
    const matched=S.allParticipants.find(p=>{
      const pName=p.name||'';
      const pPhone=p.phone||'';
      const pTicket=p.ticket||(p.fields&&p.fields.ticket)||'';
      return pName===sName&&pPhone===sPhone&&pTicket===sTicket;
    });
    if(!matched){
      showFailModal(S.signFailMsg);
      return;
    }
    if(sTicket&&S.voidedTickets&&S.voidedTickets.includes(sTicket)){
      showFailModal('该抽奖券编码已被作废，无法签到！');
      return;
    }
  }
  const remark=document.getElementById('signRemark').value.trim();
  if(remark)data.remark=remark;
  if(S.avatarData){data.avatar=S.avatarData;data.fields=data.fields||{};data.fields.avatar=S.avatarData}
  if(S.signin.enable&&S.signin.lat!=null){
    if(!navigator.geolocation){toast('不支持定位');submitSignin(data);return}
    const ls=document.getElementById('signLocStatus');ls.innerHTML='📍 正在获取定位...';ls.style.color='var(--gold)';
    navigator.geolocation.getCurrentPosition(pos=>{
      const lat=pos.coords.latitude,lng=pos.coords.longitude;
      const dist=calcDist(lat,lng,S.signin.lat,S.signin.lng);
      const now=new Date(),st=S.signin.startTime?new Date(S.signin.startTime):null,et=S.signin.endTime?new Date(S.signin.endTime):null;
      if(dist>S.signin.radius){ls.innerHTML='❌ 距签到点 '+Math.round(dist)+' 米，超出 '+S.signin.radius+' 米范围';ls.style.color='var(--red)';toast('不在签到范围内');return}
      if(st&&now<st){ls.innerHTML='⏰ 签到未开始';ls.style.color='var(--red)';toast('签到尚未开始');return}
      if(et&&now>et){ls.innerHTML='⏰ 签到已截止';ls.style.color='var(--red)';toast('签到已截止');return}
      ls.innerHTML='✅ 定位成功，距签到点 '+Math.round(dist)+' 米';ls.style.color='var(--grn)';
      data.lat=lat;data.lng=lng;data.distance=Math.round(dist);
      submitSignin(data);
    },err=>{ls.innerHTML='❌ 定位失败：'+(err.message||'请允许定位');ls.style.color='var(--red)';toast('定位失败')},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  }else{
    submitSignin(data);
  }
}

function submitSignin(data){
  S.fields.forEach(f=>{if(f.type==='text'&&!data.name)data.name=data[f.name]||data[f.id]||'';if(f.type==='phone'&&!data.phone)data.phone=data[f.name]||data[f.id]||''});
  S.signedIn=true;
  var nickEl=document.getElementById('wxNickname');
  S.myName=(nickEl&&nickEl.value.trim())||data.name||'';

  try{localStorage.setItem('cj_signed_'+S.room,JSON.stringify({name:S.myName,time:Date.now()}))}catch(e){}
  const id=data.id||uid();data.id=id;data.signed=true;data.signTime=Date.now();
  S.mqtt.publish(S.topic+'sign_in',JSON.stringify({id:id,name:data.name||'',phone:data.phone||'',lat:data.lat,lng:data.lng,distance:data.distance,signTime:data.signTime,fields:data}));

}

function calcDist(la1,lo1,la2,lo2){const R=6371000,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}

function processAvatarFile(file){
  if(!file){return}
  if(!file.type.startsWith('image/')){toast('请选择图片');return}
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      canvas.width=200;canvas.height=200;
      var ctx=canvas.getContext('2d');
      var size=Math.min(img.width,img.height);
      var sx=(img.width-size)/2;
      var sy=(img.height-size)/2;
      ctx.drawImage(img,sx,sy,size,size,0,0,200,200);
      S._avatarTmp=canvas.toDataURL('image/jpeg',0.7);
      var prev=document.getElementById('avatarPagePreview');
      prev.innerHTML='<img src="'+S._avatarTmp+'" style="width:100px;height:100px;border-radius:50%;object-fit:cover">';
      toast('头像已选择，点击保存确认');
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
  // 清空 input 以便重复选择同一张图
  document.getElementById('avatarFileInput').value='';
}

function initShakeGame(){
  document.getElementById('gameTitle').textContent='📱 摇一摇大赛';
  document.getElementById('gameDesc').textContent='等待大屏开始...';
  document.getElementById('gameContent').innerHTML='<div class="card" style="text-align:center"><p style="color:var(--sub);line-height:2">大屏开始后<br>请疯狂摇动手机<br>摇动次数越多排名越高！</p></div>';
}
function startShakeRound(){
  S.shakeCount=0;S.shakePending=0;
  if(S.shakeBatchTimer){clearInterval(S.shakeBatchTimer);S.shakeBatchTimer=null}
  document.getElementById('gameDesc').textContent='开始摇一摇！';
  document.getElementById('gameContent').innerHTML='<div class="card" style="text-align:center"><div style="font-size:3em;margin:20px 0">📳</div><div style="font-size:2em;font-weight:bold;color:var(--gold)" id="shakeNum">0</div><p style="color:var(--sub);margin-top:8px">摇动次数</p><p style="color:var(--gold);font-size:.85em;margin-top:12px">疯狂摇动手机！</p></div>';
  // 批量上报：每1秒发送累计摇动次数，减少90%消息量
  S.shakeBatchTimer=setInterval(function(){
    if(S.shakePending>0&&S.mqtt&&S.mqtt.connected){
      S.mqtt.publish(S.topic+'shake_data',JSON.stringify({name:S.myName||'匿名',count:S.shakePending}));
      S.shakePending=0;
    }
  },1000);
  if(window.DeviceMotionEvent){
    shakeListening=true;
    let lastAccel=0,lastTime=0;
    window.addEventListener('devicemotion',e=>{
      if(!shakeListening)return;
      const acc=e.accelerationIncludingGravity;
      if(!acc||!acc.x)return;
      const mag=Math.sqrt(acc.x*acc.x+acc.y*acc.y+acc.z*acc.z);
      const diff=Math.abs(mag-lastAccel);lastAccel=mag;
      const now=Date.now();
      if(diff>15&&now-lastTime>100){
        S.shakeCount++;S.shakePending++;lastTime=now;
        const el=document.getElementById('shakeNum');if(el)el.textContent=S.shakeCount;
        if(navigator.vibrate)navigator.vibrate(30);
      }
    });
  }else{
    document.getElementById('gameContent').innerHTML='<div class="card" style="text-align:center"><div style="font-size:3em;margin:20px 0">📳</div><div style="font-size:2em;font-weight:bold;color:var(--gold)" id="shakeNum">0</div><p style="color:var(--sub);margin-top:8px">点击次数</p><button class="btn btn-pri" style="width:100%;padding:30px;margin-top:16px;font-size:1.2em" id="shakeBtn">👆 点击摇一摇</button></div>';
    document.getElementById('shakeBtn').onclick=()=>{S.shakeCount++;S.shakePending++;document.getElementById('shakeNum').textContent=S.shakeCount};
  }
}
function stopShakeBatch(){
  if(S.shakeBatchTimer){clearInterval(S.shakeBatchTimer);S.shakeBatchTimer=null}
  if(S.shakePending>0&&S.mqtt&&S.mqtt.connected){
    S.mqtt.publish(S.topic+'shake_data',JSON.stringify({name:S.myName||'匿名',count:S.shakePending}));
    S.shakePending=0;
  }
}

function reactionEarlyClick(){
  // 惩罚：提前点击（红灯状态）禁止点击3秒
  var now=Date.now();
  if(S.reactionPenaltyUntil&&now<S.reactionPenaltyUntil){
    toast('⏳ 惩罚中，请等待...',1500);
    return;
  }
  if(S.reactionReady)return;
  S.reactionPenaltyUntil=now+3000;
  document.getElementById('gameContent').innerHTML='<div class="card" style="text-align:center;background:#e17055;border:3px solid #fff;animation:pulse 0.5s infinite"><div style="font-size:1.3em;font-weight:bold;color:#fff;margin-bottom:8px">🚫 抢跑惩罚！</div><p style="color:#fff;font-size:.9em;margin-bottom:12px">提前点击，禁止操作 <b id="penaltyCount" style="font-size:1.4em">3</b> 秒</p><div style="color:rgba(255,255,255,.8);font-size:.8em">⏳ 请等待倒计时结束再点击</div></div>';
  // 倒计时动画
  var n=3;
  var iv=setInterval(function(){
    n--;
    var el=document.getElementById('penaltyCount');
    if(el)el.textContent=Math.max(n,0);
    if(n<=0){clearInterval(iv);
      if(S.reactionReady){return}
      // 恢复等待信号界面（若仍处于红灯阶段）
      if(!S.reactionReady){
        document.getElementById('gameContent').innerHTML='<div class="card" id="reactionZone" style="text-align:center;background:#e17055;border-color:var(--red);cursor:pointer" onclick="reactionEarlyClick()"><div style="font-size:1.2em;font-weight:bold;color:#fff">🔴 等待信号</div><p style="color:rgba(255,255,255,.7);font-size:.85em;margin-top:8px">屏幕变绿后立刻点击</p></div>';
      }
    }
  },1000);
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
}
function reactionClick(){
  if(!S.reactionReady)return;
  // 若处于惩罚期，禁止点击
  var now=Date.now();
  if(S.reactionPenaltyUntil&&now<S.reactionPenaltyUntil){toast('⏳ 惩罚中，请稍候...');return}

}

function showQuizQuestion(d){
  document.getElementById('gameDesc').textContent='请选择答案！';
  const q=d.question||'题目';const opts=d.options||['A','B','C','D'];
  document.getElementById('gameContent').innerHTML='<div class="card"><div style="font-size:1.1em;font-weight:bold;margin-bottom:16px;text-align:center">'+q+'</div>'+opts.map((o,i)=>'<button class="btn btn-out" style="width:100%;padding:14px;margin-bottom:8px;text-align:left;justify-content:flex-start" onclick="quizSelect(this,\''+o.replace(/'/g,"\\'")+'\')"><b style="margin-right:8px">'+'ABCD'[i]+'.</b> '+o+'</button>').join('')+'</div>';
}
function quizSelect(btn,answer){
  if(S.quizAnswer)return;S.quizAnswer=answer;
  document.querySelectorAll('#gameContent .btn').forEach(b=>{b.style.opacity=.5;b.disabled=true});btn.style.opacity=1;btn.style.borderColor='var(--pri)';btn.style.color='#fff';
  if(S.mqtt&&S.mqtt.connected)S.mqtt.publish(S.topic+'quiz_answer',JSON.stringify({name:S.myName||'匿名',answer:answer}));
  toast('已选择：'+answer);
}
function showGameResult(d){
  const r=document.getElementById('gameResult');r.style.display='block';
  var gameNames={shake:'摇一摇',reaction:'反应速度',quiz:'趣味抢答'};
  var gameName=gameNames[d.game]||'互动游戏';
  var myName=S.myName||'';
  // 查找当前用户的排名
  var myRank=null;
  if(d.rankings&&d.rankings.length&&myName){
    myRank=d.rankings.find(function(p){return p.name===myName});
  }
  var html='';
  // 个人排名凭证卡片（高亮显示）
  if(myRank){
    var medal=['🥇','🥈','🥉'][myRank.rank-1]||'🎉 第'+myRank.rank+'名';
    var scoreText='';
    if(myRank.score){scoreText=d.game==='reaction'?(myRank.score/1000).toFixed(3)+'秒':myRank.score+'次'}
    html+='<div class="card" style="border:3px solid var(--gold);text-align:center;background:linear-gradient(135deg,rgba(253,203,110,.15),rgba(253,203,110,.05))"><div style="font-size:.85em;color:var(--gold);margin-bottom:6px">🎁 礼品派发凭证</div><div style="font-size:2.5em;margin:8px 0">'+medal+'</div><div style="font-size:1.1em;font-weight:bold;margin-bottom:4px">'+myRank.name+'</div><div style="font-size:.85em;color:var(--sub);margin-bottom:8px">'+gameName+(scoreText?' · '+scoreText:'')+'</div><div style="font-size:.75em;color:var(--sub);border-top:1px solid var(--bd);padding-top:8px">请截图此页面作为领奖凭证</div></div>';
  }
  // 完整排名列表
  if(d.rankings&&d.rankings.length){
    html+='<div class="card" style="border:2px solid var(--gold);text-align:center"><div style="font-size:1.1em;font-weight:bold;color:var(--gold);margin-bottom:12px">🏆 完整排名</div>'+d.rankings.map(function(p){
      var isMe=p.name===myName;
      var medal=['🥇','🥈','🥉'][p.rank-1]||'🎉';
      var scoreText=p.score?(d.game==='reaction'?(p.score/1000).toFixed(3)+'秒':p.score+'次'):'';
      return '<div style="padding:8px 16px;border-radius:10px;margin-bottom:6px;'+(isMe?'background:rgba(253,203,110,.25);border:1px solid var(--gold)':'background:rgba(253,203,110,.1)')+';font-size:.95em;'+(isMe?'font-weight:bold':'')+'">'+medal+' '+p.name+(scoreText?' - '+scoreText:'')+(isMe?' <span style="color:var(--gold);font-size:.8em">（我）</span>':'')+'</div>';
    }).join('')+'</div>';
  }
  if(d.correct){
    html='<div class="card" style="border:2px solid var(--grn);text-align:center;margin-bottom:12px"><div style="color:var(--grn);font-weight:bold">✅ 正确答案：'+d.correct+'</div>'+( !(d.rankings&&d.rankings.length)?'<div style="margin-top:8px;color:var(--sub)">没有人答对</div>':'')+'</div>'+html;
  }
  r.innerHTML=html;
}
function exitGame(){
  S.gameType=null;shakeListening=false;S.quizAnswer=null;S.reactionReady=false;S.reactionPenaltyUntil=0;
  stopShakeBatch();
  backToHome();
}
</script>
</body>
</html>
